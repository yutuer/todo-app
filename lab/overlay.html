  <!-- ===== 风格层：由 lab/build.py 叠到最新 index.html 上生成 style-showcase.html ===== -->
  <!-- ===== 本文件不含应用代码，只含皮肤 CSS 与切换器，因此不会与主站漂移 ===== -->
  <div class="skin-bar" role="group" aria-label="风格切换">
    <span class="skin-label">风格样机</span>
    <button class="skin-btn active" data-skin="violet">默认紫</button>
    <button class="skin-btn" data-skin="cartoon">卡通风</button>
    <button class="skin-btn" data-skin="cyber">赛博风</button>
    <button class="skin-btn" data-skin="robot">机器人</button>
    <button class="skin-btn" data-skin="anime">二次元</button>
    <button class="skin-btn" data-skin="ink">水墨风</button>
  </div>

  <style>
    /* ---------- 切换器本体（固定中性色，不随皮肤变化，保证任何皮肤下都可见） ---------- */
    .skin-bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; padding: 9px 12px; background: rgba(18,18,22,.94); border-bottom: 1px solid rgba(255,255,255,.12); box-shadow: 0 6px 24px rgba(0,0,0,.45); z-index: 9999; font-family: Inter, system-ui, sans-serif; }
    .skin-label { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 11px; letter-spacing: 2px; color: #6b6b74; white-space: nowrap; }
    .skin-btn { padding: 7px 14px; border: none; border-radius: 999px; background: transparent; color: #a1a1aa; font-size: 12px; font-family: inherit; cursor: pointer; transition: background .18s, color .18s; white-space: nowrap; }
    .skin-btn:hover { color: #fff; background: rgba(255,255,255,.09); }
    .skin-btn.active { background: #8b5cf6; color: #fff; font-weight: 600; }
    body { padding-top: 58px; }
    @media (max-width: 760px) {
      .skin-label { display: none; }
      .skin-btn { padding: 6px 9px; font-size: 11px; }
      body { padding-top: 52px; }
    }

    /* ================= 1. 卡通风 ================= */
    body[data-skin="cartoon"] {
      --bg-primary: #2a1f3d; --bg-card: #382a4f; --text-primary: #fff6e5;
      --text-secondary: #d8c8ef; --text-muted: #a893c4; --border: #6b4a9e;
      --accent: #ffd166; --accent-light: rgba(255,209,102,.18); --accent-glow: rgba(255,209,102,.35);
      --danger: #ff7b7b; --success: #7be495;
      --shadow: 5px 5px 0 rgba(18,10,32,.6);
      font-family: "Comic Sans MS", "Chalkboard SE", "Microsoft YaHei", sans-serif;
    }
    body[data-skin="cartoon"]::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255,209,102,.14) 2px, transparent 2.5px);
      background-size: 26px 26px;
    }
    body[data-skin="cartoon"] .layout { position: relative; z-index: 1; }
    body[data-skin="cartoon"] .calendar-card,
    body[data-skin="cartoon"] .input-card,
    body[data-skin="cartoon"] .quick-card,
    body[data-skin="cartoon"] .todo-item { border-width: 3px; border-radius: 18px; }
    body[data-skin="cartoon"] h1 { background: none; -webkit-text-fill-color: #fff6e5; letter-spacing: .5px; }
    body[data-skin="cartoon"] .btn-add { border: 3px solid #2a1f3d; border-radius: 16px; color: #2a1f3d; font-weight: 700; }
    body[data-skin="cartoon"] .btn-add:hover { transform: translate(3px,3px); box-shadow: 1px 1px 0 rgba(18,10,32,.6); }
    body[data-skin="cartoon"] .filter-btn { border-width: 2px; border-radius: 999px; }
    body[data-skin="cartoon"] .filter-btn.active { color: #2a1f3d; font-weight: 700; }
    body[data-skin="cartoon"] .cal-day { border-radius: 10px; }
    body[data-skin="cartoon"] .cal-day.selected { color: #2a1f3d; font-weight: 700; }
    body[data-skin="cartoon"] .quick-chip { border-radius: 999px; border-width: 2px; }

    /* ================= 2. 赛博朋克 ================= */
    body[data-skin="cyber"] {
      --bg-primary: #05070d; --bg-card: #0a1020; --text-primary: #d7f9ff;
      --text-secondary: #7fb8cc; --text-muted: #4a7a8c; --border: #16324a;
      --accent: #00e5ff; --accent-light: rgba(0,229,255,.14); --accent-glow: rgba(0,229,255,.45);
      --danger: #ff2d95; --success: #00ffa3;
      --shadow: 0 0 0 1px rgba(0,229,255,.16), 0 10px 34px rgba(0,229,255,.07);
      font-family: "JetBrains Mono", "Consolas", "Courier New", monospace;
    }
    body[data-skin="cyber"]::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,.06) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    body[data-skin="cyber"] .layout { position: relative; z-index: 1; }
    body[data-skin="cyber"] .calendar-card,
    body[data-skin="cyber"] .input-card,
    body[data-skin="cyber"] .quick-card,
    body[data-skin="cyber"] .todo-item {
      border-radius: 0;
      clip-path: polygon(0 12px, 12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    }
    body[data-skin="cyber"] h1 { background: none; -webkit-text-fill-color: #d7f9ff; text-shadow: 0 0 20px rgba(0,229,255,.6); letter-spacing: 3px; }
    body[data-skin="cyber"] .btn-add { border-radius: 0; color: #05070d; font-weight: 700; letter-spacing: 1.5px; }
    body[data-skin="cyber"] .filter-btn { border-radius: 0; letter-spacing: 1px; }
    body[data-skin="cyber"] .filter-btn.active, body[data-skin="cyber"] .cal-day.selected { color: #05070d; }
    body[data-skin="cyber"] .cal-day { border-radius: 0; }
    body[data-skin="cyber"] .quick-chip { border-radius: 0; }

    /* ================= 3. 机器人 ================= */
    body[data-skin="robot"] {
      --bg-primary: #080b09; --bg-card: #101613; --text-primary: #d8e8dd;
      --text-secondary: #7fa08c; --text-muted: #54705f; --border: #26382e;
      --accent: #3dff9e; --accent-light: rgba(61,255,158,.12); --accent-glow: rgba(61,255,158,.3);
      --danger: #ff5d5d; --success: #3dff9e;
      --shadow: inset 0 1px 0 rgba(61,255,158,.07), 0 2px 0 rgba(0,0,0,.7);
      font-family: "JetBrains Mono", "Consolas", monospace;
    }
    body[data-skin="robot"] .calendar-card,
    body[data-skin="robot"] .input-card,
    body[data-skin="robot"] .quick-card,
    body[data-skin="robot"] .todo-item { border-radius: 3px; border-color: #2b4034; }
    body[data-skin="robot"] h1 { background: none; -webkit-text-fill-color: #d8e8dd; letter-spacing: 5px; font-size: 20px; font-weight: 500; }
    body[data-skin="robot"] .subtitle { letter-spacing: 2px; text-transform: uppercase; font-size: 10px; }
    body[data-skin="robot"] .btn-add { border-radius: 3px; color: #080b09; font-weight: 700; letter-spacing: 1px; }
    body[data-skin="robot"] .filter-btn { border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
    body[data-skin="robot"] .filter-btn.active, body[data-skin="robot"] .cal-day.selected { color: #080b09; }
    body[data-skin="robot"] .cal-day { border-radius: 2px; }
    body[data-skin="robot"] .todo-item { position: relative; }
    body[data-skin="robot"] .todo-item::before,
    body[data-skin="robot"] .todo-item::after { content: ''; position: absolute; width: 3px; height: 3px; background: #3dff9e; opacity: .45; }
    body[data-skin="robot"] .todo-item::before { left: 5px; top: 5px; }
    body[data-skin="robot"] .todo-item::after { right: 5px; bottom: 5px; }
    body[data-skin="robot"] .checkbox { border-radius: 2px; }

    /* ================= 4. 二次元 ================= */
    body[data-skin="anime"] {
      --bg-primary: #241a2e; --bg-card: #33243f; --text-primary: #fff0f8;
      --text-secondary: #e0b8d4; --text-muted: #b08aa6; --border: #5c3f6b;
      --accent: #ff8ec7; --accent-light: rgba(255,142,199,.16); --accent-glow: rgba(255,142,199,.4);
      --danger: #ff6b8a; --success: #8ce99a;
      --shadow: 0 8px 28px rgba(255,142,199,.16);
      font-family: "Hiragino Sans", "Yu Gothic", "Microsoft YaHei", sans-serif;
    }
    body[data-skin="anime"] .calendar-card,
    body[data-skin="anime"] .input-card,
    body[data-skin="anime"] .todo-item { border-radius: 18px; }
    body[data-skin="anime"] .quick-card { border-radius: 18px; border-style: dashed; border-color: rgba(255,142,199,.45); }
    body[data-skin="anime"] h1 { background: linear-gradient(135deg,#fff0f8,#ff8ec7); -webkit-background-clip: text; }
    body[data-skin="anime"] .btn-add { border-radius: 999px; color: #2a1030; font-weight: 700; }
    body[data-skin="anime"] .filter-btn { border-radius: 999px; }
    body[data-skin="anime"] .filter-btn.active, body[data-skin="anime"] .cal-day.selected { color: #2a1030; }
    body[data-skin="anime"] .cal-day { border-radius: 10px; }
    body[data-skin="anime"] .quick-chip { border-radius: 999px; }
    body[data-skin="anime"] .checkbox { border-radius: 50%; }

    /* ================= 5. 水墨 ================= */
    body[data-skin="ink"] {
      --bg-primary: #14100d; --bg-card: #1d1815; --text-primary: #ece3d5;
      --text-secondary: #b9ab99; --text-muted: #8a7b69; --border: #3b322b;
      --accent: #c8402f; --accent-light: rgba(200,64,47,.16); --accent-glow: rgba(200,64,47,.28);
      --danger: #c8402f; --success: #7a8f5a;
      --shadow: 0 2px 0 rgba(0,0,0,.55);
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    }
    body[data-skin="ink"]::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(58% 40% at 12% 6%, rgba(200,64,47,.075), transparent 70%),
        radial-gradient(52% 38% at 88% 94%, rgba(236,227,213,.06), transparent 70%),
        repeating-linear-gradient(90deg, rgba(236,227,213,.022) 0 1px, transparent 1px 3px);
    }
    body[data-skin="ink"] .layout { position: relative; z-index: 1; }
    body[data-skin="ink"] .calendar-card,
    body[data-skin="ink"] .input-card,
    body[data-skin="ink"] .quick-card,
    body[data-skin="ink"] .todo-item { border-radius: 2px; border-left: 3px solid rgba(200,64,47,.6); }
    body[data-skin="ink"] h1 { background: none; -webkit-text-fill-color: #ece3d5; letter-spacing: 7px; font-weight: 500; }
    body[data-skin="ink"] .btn-add { border-radius: 2px; background: #c8402f; color: #f5ede1; letter-spacing: 5px; box-shadow: none; }
    body[data-skin="ink"] .filter-btn { border-radius: 2px; letter-spacing: 2px; }
    body[data-skin="ink"] .cal-day { border-radius: 2px; }
    body[data-skin="ink"] .quick-chip { border-radius: 2px; }
    body[data-skin="ink"] h1::after { content: '记'; display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; margin-left: 14px; border: 1.5px solid #c8402f; color: #c8402f; font-size: 9px; letter-spacing: 0; line-height: 1; vertical-align: middle; opacity: .9; }
    body[data-skin="ink"] .date-label { border-bottom: 1px dotted rgba(236,227,213,.16); border-radius: 0; }
    body[data-skin="ink"] .todo-item { border-width: 1px; border-left-width: 2px; }
    body[data-skin="ink"] .stat-value { text-shadow: none; }
    body[data-skin="ink"] .btn-add:hover { background: #a93325; }
  </style>

  <script>
    (function () {
      var bar = document.querySelector('.skin-bar');
      var btns = Array.prototype.slice.call(bar.querySelectorAll('.skin-btn'));
      function apply(skin) {
        if (skin === 'violet') document.body.removeAttribute('data-skin');
        else document.body.setAttribute('data-skin', skin);
        btns.forEach(function (b) { b.classList.toggle('active', b.dataset.skin === skin); });
      }
      bar.addEventListener('click', function (e) {
        var b = e.target.closest('.skin-btn');
        if (b) apply(b.dataset.skin);
      });
      var fromHash = (location.hash || '').replace('#', '');
      if (fromHash) apply(fromHash);
    })();
  </script>
