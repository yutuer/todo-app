<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238b5cf6'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body class="has-skinbar">
  <div class="skin-bar" role="group" aria-label="风格切换">
    <span class="skin-label">风格预览</span>
    <button class="skin-btn active" data-skin="violet">默认紫</button>
    <button class="skin-btn" data-skin="cartoon">卡通风</button>
    <button class="skin-btn" data-skin="cyber">赛博风</button>
    <button class="skin-btn" data-skin="robot">机器人</button>
    <button class="skin-btn" data-skin="anime">二次元</button>
    <button class="skin-btn" data-skin="ink">水墨风</button>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <div class="calendar-card">
        <div class="calendar-header">
          <button class="cal-nav" id="prev-month">&lt;</button>
          <span class="cal-title" id="cal-title"></span>
          <button class="cal-nav" id="next-month">&gt;</button>
        </div>
        <div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="calendar-grid" id="calendar-grid"></div>
        <button class="today-btn" id="today-btn">今天</button>
      </div>
      <div class="quick-card" id="quick-card">
        <div class="quick-head" id="quick-head">
          <span class="quick-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
            快捷语
            <span class="quick-count" id="quick-count"></span>
          </span>
          <span class="quick-chevron" id="quick-chevron">▼</span>
        </div>
        <div class="quick-body" id="quick-body">
          <div class="quick-chips" id="quick-chips"></div>
          <div class="quick-editor" id="quick-editor">
            <input type="text" id="quick-input" placeholder="输入常用任务短语，回车保存..." maxlength="50">
            <button class="quick-save" id="quick-save">保存</button>
            <button class="quick-cancel" id="quick-cancel">取消</button>
          </div>
        </div>
      </div>
      <div class="label-card" id="label-card">
        <div class="label-head" id="label-head">
          <span class="label-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.2"/></svg>
            标签
            <span class="label-count" id="label-count"></span>
          </span>
          <span class="label-chevron">▼</span>
        </div>
        <div class="label-body" id="label-body">
          <div class="label-list" id="label-list"></div>
          <div class="label-hint">点标签行 = 只看该标签的事项<br>按住标签拖到右侧任务上 = 给任务加标签</div>
          <div class="label-editor" id="label-editor">
            <input type="text" id="label-input" placeholder="标签名称，回车保存..." maxlength="20" title="改名即时生效：任务上的标签会立刻跟着变">
            <div class="label-palette" id="label-palette"></div>
            <div class="label-error" id="label-error"></div>
            <div class="label-editor-actions">
              <button class="label-save" id="label-save">完成</button>
              <button class="label-cancel" id="label-cancel">撤销</button>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <main class="main">
      <header>
        <h1>待办事项</h1>
        <p class="subtitle">记录每天要完成的任务</p>
        <div class="stats">
          <div class="stat"><div class="stat-value" id="total-count">0</div><div class="stat-label">总计</div></div>
          <div class="stat"><div class="stat-value" id="completed-count">0</div><div class="stat-label">已完成</div></div>
          <div class="stat"><div class="stat-value" id="remaining-count">0</div><div class="stat-label">剩余</div></div>
        </div>
      </header>
      <div class="input-card">
        <div class="input-row">
          <input type="date" id="todo-date">
          <div class="input-wrap">
            <input type="text" id="todo-input" placeholder="添加新任务..." maxlength="200">
            <button class="input-clear" id="input-clear" type="button" title="清空输入" aria-label="清空输入">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <button class="btn-add" id="add-btn">添加</button>
        </div>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="active">进行中</button>
        <button class="filter-btn" data-filter="completed">已完成</button>
        <span class="label-filter-chip" id="label-filter-chip"></span>
      </div>
      <div class="todo-list" id="todo-list"></div>
      <div class="clear-completed" id="clear-container" style="display:none;"><button class="btn-clear" id="clear-btn">清除已完成</button></div>
      <div class="build-tag"><span id="build-stamp">dev</span></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
