<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238b5cf6'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0f0f10; --bg-card: #1c1c1f; --text-primary: #fafafa;
      --text-secondary: #a1a1aa; --text-muted: #71717a; --border: #27272a;
      --accent: #8b5cf6; --accent-light: rgba(139,92,246,0.15);
      --accent-glow: rgba(139,92,246,0.3); --danger: #f87171; --success: #4ade80; --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    body { font-family: Inter, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding: 24px; }
    .layout { display: flex; gap: 20px; max-width: 1100px; margin: 0 auto; }
    .sidebar { width: 200px; flex-shrink: 0; position: sticky; top: 24px; align-self: flex-start; max-height: calc(100vh - 48px); overflow-y: auto; scrollbar-width: thin; }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .main { flex: 1; min-width: 0; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg,var(--text-primary),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: var(--text-secondary); font-size: 12px; }
    .calendar-card { background: var(--bg-card); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cal-title { font-size: 13px; font-weight: 600; }
    .cal-nav { width: 26px; height: 26px; border: 1px solid var(--border); background: var(--bg-primary); border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
    .cal-nav:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; margin-bottom: 4px; }
    .calendar-weekdays span { font-size: 9px; color: var(--text-muted); padding: 3px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 6px; cursor: pointer; transition: all 0.15s; position: relative; color: var(--text-secondary); }
    .cal-day:hover { background: var(--border); color: var(--text-primary); }
    .cal-day.other-month { color: var(--text-muted); opacity: 0.35; }
    .cal-day.today { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .cal-day.selected { background: linear-gradient(135deg,var(--accent),var(--accent)); color: white; font-weight: 600; }
    .cal-day.has-todos::after { content: ''; position: absolute; bottom: 3px; width: 3px; height: 3px; background: var(--accent); border-radius: 50%; }
    .cal-day.selected.has-todos::after { background: white; }
    .today-btn { width: 100%; margin-top: 10px; padding: 8px; background: var(--accent-light); border: 1px solid var(--accent-glow); border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--accent); cursor: pointer; font-family: inherit; }
    .today-btn:hover { background: var(--accent); color: white; }
    .stats { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat-value { font-size: 22px; font-weight: 700; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
    .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .input-card { background: var(--bg-card); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--border); }
    .input-row { display: flex; gap: 8px; }
    .input-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
    .input-wrap input[type="text"] { flex: 1; min-width: 0; padding-right: 34px; }
    .input-clear { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; padding: 0; border: none; border-radius: 50%; background: var(--border); color: var(--text-secondary); cursor: pointer; display: none; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
    .input-clear.show { display: flex; }
    .input-clear:hover { background: var(--danger); color: #fff; }
    .input-clear svg { width: 11px; height: 11px; }
    input[type="date"] { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; cursor: pointer; background: var(--bg-primary); color: var(--text-primary); }
    input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--bg-primary); color: var(--text-primary); outline: none; }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    input[type="text"]::placeholder { color: var(--text-muted); }
    .btn-add { padding: 10px 16px; background: linear-gradient(135deg,var(--accent),var(--accent)); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px var(--accent-glow); font-family: inherit; }
    .btn-add:hover { transform: translateY(-1px); }
    .filters { display: flex; gap: 6px; margin-bottom: 14px; }
    .filter-btn { padding: 7px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .filter-btn:hover { border-color: var(--text-muted); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .date-section { margin-bottom: 14px; }
    .date-section.collapsed .todo-list { display: none; }
    .date-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.2s; }
    .date-label:hover { background: var(--bg-card); }
    .date-label svg { width: 12px; height: 12px; color: var(--accent); transition: transform 0.2s; }
    .date-section.collapsed .date-label svg { transform: rotate(-90deg); }
    .date-label .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--accent-light); color: var(--accent); font-weight: 500; }
    .date-label .tag.yesterday { background: rgba(251,146,60,0.15); color: #fb923c; }
    .date-label .count { font-size: 10px; color: var(--text-muted); }
    .date-label .chevron { margin-left: auto; font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
    .date-section.collapsed .date-label .chevron { transform: rotate(-90deg); }
    .date-label .collapsed-hint { font-size: 10px; color: var(--text-muted); margin-left: 8px; }
    .todo-list { display: flex; flex-direction: column; gap: 6px; }
    .todo-item { background: var(--bg-card); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); }
    .todo-item.continued { border-left: 3px solid #fb923c; }
    .todo-item.completed { opacity: 0.7; }
    .checkbox { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
    .checkbox:hover { border-color: var(--accent); }
    .checkbox.checked { background: var(--success); border-color: var(--success); }
    .checkbox.checked::after { content: ''; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .todo-content { flex: 1; min-width: 0; }
    .todo-date { font-size: 10px; color: var(--accent); cursor: pointer; margin-bottom: 2px; }
    .todo-date:hover { text-decoration: underline; }
    .todo-text { font-size: 13px; line-height: 1.4; word-break: break-word; }
    .todo-item.completed .todo-text { color: var(--text-muted); text-decoration: line-through; }
    .todo-time { font-size: 10px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; }
    .todo-time .completed-time { color: var(--success); }
    .todo-source { font-size: 10px; color: #fb923c; }
    .todo-actions { display: flex; gap: 4px; opacity: 0; }
    .todo-item:hover .todo-actions { opacity: 1; }
    .btn-edit, .btn-delete { width: 28px; height: 28px; border: none; background: transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
    .btn-edit:hover { background: var(--accent-light); color: var(--accent); }
    .btn-delete:hover { background: rgba(248,113,113,0.1); color: var(--danger); }
    .btn-edit svg, .btn-delete svg { width: 14px; height: 14px; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state svg { width: 44px; height: 44px; margin-bottom: 12px; opacity: 0.4; color: var(--accent); }
    .clear-completed { margin-top: 16px; text-align: center; }
    .build-tag { margin-top: 20px; text-align: center; font-size: 10px; color: var(--text-muted); letter-spacing: .5px; opacity: .75; }
    .btn-clear { padding: 8px 16px; background: transparent; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .btn-clear:hover { border-color: var(--danger); color: var(--danger); }
    @media (max-width: 768px) { body { padding: 16px; } .layout { flex-direction: column; } .sidebar { width: 100%; position: static; max-height: none; overflow: visible; } .input-row { flex-direction: column; } .btn-add { width: 100%; } .todo-actions { opacity: 1; } }

    /* ---- 快捷语面板 ---- */
    .quick-card { background: var(--bg-card); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-top: 14px; overflow: hidden; }
    .sidebar .quick-chips { flex-direction: column; align-items: stretch; }
    .sidebar .quick-chip, .sidebar .quick-add { width: 100%; }
    .sidebar .quick-chip > span:first-child { flex: 1; min-width: 0; }
    .sidebar .quick-editor { flex-wrap: wrap; }
    .sidebar .quick-editor input { flex: 1 1 100%; }
    .quick-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; cursor: pointer; user-select: none; }
    .quick-head:hover { background: var(--bg-primary); }
    .quick-title { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.3px; }
    .quick-title svg { width: 13px; height: 13px; color: var(--accent); }
    .quick-count { font-size: 10px; font-weight: 400; color: var(--text-muted); }
    .quick-chevron { font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
    .quick-card.collapsed .quick-chevron { transform: rotate(-90deg); }
    .quick-card.collapsed .quick-body { display: none; }
    .quick-body { padding: 0 14px 12px; }
    .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .quick-chip { position: relative; display: inline-flex; align-items: center; max-width: 100%; padding: 6px 11px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
    .quick-chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .quick-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .quick-chip-actions { display: none; gap: 3px; margin-left: 6px; flex-shrink: 0; }
    .quick-chip:hover .quick-chip-actions { display: inline-flex; }
    .quick-chip-btn { width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; cursor: pointer; font-size: 9px; line-height: 1; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; }
    .quick-chip-btn.edit { background: var(--accent); color: #fff; }
    .quick-chip-btn.del { background: var(--danger); color: #fff; }
    .quick-add { padding: 6px 11px; background: transparent; border: 1px dashed var(--border); border-radius: 20px; font-size: 12px; color: var(--text-muted); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .quick-add:hover { border-color: var(--accent); color: var(--accent); }
    .quick-editor { display: none; gap: 6px; margin-top: 10px; }
    .quick-editor.show { display: flex; }
    .quick-editor input { flex: 1; min-width: 0; padding: 7px 11px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-family: inherit; color: var(--text-primary); outline: none; }
    .quick-editor input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    .quick-editor button { padding: 7px 12px; border-radius: 8px; font-size: 12px; font-family: inherit; cursor: pointer; border: none; }
    .quick-save { background: var(--accent); color: #fff; font-weight: 600; }
    .quick-cancel { background: var(--bg-primary); color: var(--text-secondary); border: 1px solid var(--border); }
    .quick-cancel:hover { border-color: var(--text-muted); color: var(--text-primary); }
    @media (max-width: 768px) { .quick-editor { flex-wrap: wrap; } .quick-editor input { flex: 1 1 100%; } }

    /* ================= 风格皮肤 =================
       切换器常驻，默认紫色。选择记在 localStorage（todo_skin），
       也支持 URL 参数 ?skin=xxx 直接指定（优先级最高）。 */
    .skin-bar { display: flex; position: fixed; top: 0; left: 0; right: 0; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; padding: 9px 12px; background: rgba(18,18,22,.94); border-bottom: 1px solid rgba(255,255,255,.12); box-shadow: 0 6px 24px rgba(0,0,0,.45); z-index: 9999; font-family: Inter, system-ui, sans-serif; }
    .skin-label { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 11px; letter-spacing: 2px; color: #6b6b74; white-space: nowrap; }
    .skin-btn { padding: 7px 14px; border: none; border-radius: 999px; background: transparent; color: #a1a1aa; font-size: 12px; font-family: inherit; cursor: pointer; transition: background .18s, color .18s; white-space: nowrap; }
    .skin-btn:hover { color: #fff; background: rgba(255,255,255,.09); }
    .skin-btn.active { background: #8b5cf6; color: #fff; font-weight: 600; }
    body.has-skinbar { padding-top: 58px; }
    body.has-skinbar .sidebar { top: 82px; max-height: calc(100vh - 106px); }
    @media (max-width: 760px) {
      .skin-label { display: none; }
      .skin-btn { padding: 6px 9px; font-size: 11px; }
      body.has-skinbar { padding-top: 52px; }
      body.has-skinbar .sidebar { top: auto; max-height: none; }
    }

    /* ---------- 1. 卡通风 ---------- */
    body[data-skin="cartoon"] {
      --bg-primary: #2a1f3d; --bg-card: #382a4f; --text-primary: #fff6e5;
      --text-secondary: #d8c8ef; --text-muted: #a893c4; --border: #6b4a9e;
      --accent: #ffd166; --accent-light: rgba(255,209,102,.18); --accent-glow: rgba(255,209,102,.35);
      --danger: #ff7b7b; --success: #7be495;
      --shadow: 5px 5px 0 rgba(18,10,32,.6);
      font-family: "Comic Sans MS", "Chalkboard SE", "Microsoft YaHei", sans-serif;
    }
    body[data-skin="cartoon"]::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255,209,102,.14) 2px, transparent 2.5px);
      background-size: 26px 26px;
    }
    body[data-skin="cartoon"] .layout { position: relative; z-index: 1; }
    body[data-skin="cartoon"] .calendar-card,
    body[data-skin="cartoon"] .input-card,
    body[data-skin="cartoon"] .quick-card,
    body[data-skin="cartoon"] .todo-item { border-width: 3px; border-radius: 18px; }
    body[data-skin="cartoon"] h1 { background: none; -webkit-text-fill-color: #fff6e5; letter-spacing: .5px; }
    body[data-skin="cartoon"] .btn-add { border: 3px solid #2a1f3d; border-radius: 16px; color: #2a1f3d; font-weight: 700; }
    body[data-skin="cartoon"] .btn-add:hover { transform: translate(3px,3px); box-shadow: 1px 1px 0 rgba(18,10,32,.6); }
    body[data-skin="cartoon"] .filter-btn { border-width: 2px; border-radius: 999px; }
    body[data-skin="cartoon"] .filter-btn.active { color: #2a1f3d; font-weight: 700; }
    body[data-skin="cartoon"] .cal-day { border-radius: 10px; }
    body[data-skin="cartoon"] .cal-day.selected { color: #2a1f3d; font-weight: 700; }
    body[data-skin="cartoon"] .quick-chip { border-radius: 999px; border-width: 2px; }

    /* ---------- 2. 赛博朋克 ---------- */
    body[data-skin="cyber"] {
      --bg-primary: #05070d; --bg-card: #0a1020; --text-primary: #d7f9ff;
      --text-secondary: #7fb8cc; --text-muted: #4a7a8c; --border: #16324a;
      --accent: #00e5ff; --accent-light: rgba(0,229,255,.14); --accent-glow: rgba(0,229,255,.45);
      --danger: #ff2d95; --success: #00ffa3;
      --shadow: 0 0 0 1px rgba(0,229,255,.16), 0 10px 34px rgba(0,229,255,.07);
      font-family: "JetBrains Mono", "Consolas", "Courier New", monospace;
    }
    body[data-skin="cyber"]::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,.06) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    body[data-skin="cyber"] .layout { position: relative; z-index: 1; }
    body[data-skin="cyber"] .calendar-card,
    body[data-skin="cyber"] .input-card,
    body[data-skin="cyber"] .quick-card,
    body[data-skin="cyber"] .todo-item {
      border-radius: 0;
      clip-path: polygon(0 12px, 12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    }
    body[data-skin="cyber"] h1 { background: none; -webkit-text-fill-color: #d7f9ff; text-shadow: 0 0 20px rgba(0,229,255,.6); letter-spacing: 3px; }
    body[data-skin="cyber"] .btn-add { border-radius: 0; color: #05070d; font-weight: 700; letter-spacing: 1.5px; }
    body[data-skin="cyber"] .filter-btn { border-radius: 0; letter-spacing: 1px; }
    body[data-skin="cyber"] .filter-btn.active, body[data-skin="cyber"] .cal-day.selected { color: #05070d; }
    body[data-skin="cyber"] .cal-day { border-radius: 0; }
    body[data-skin="cyber"] .quick-chip { border-radius: 0; }

    /* ---------- 3. 机器人 ---------- */
    body[data-skin="robot"] {
      --bg-primary: #080b09; --bg-card: #101613; --text-primary: #d8e8dd;
      --text-secondary: #7fa08c; --text-muted: #54705f; --border: #26382e;
      --accent: #3dff9e; --accent-light: rgba(61,255,158,.12); --accent-glow: rgba(61,255,158,.3);
      --danger: #ff5d5d; --success: #3dff9e;
      --shadow: inset 0 1px 0 rgba(61,255,158,.07), 0 2px 0 rgba(0,0,0,.7);
      font-family: "JetBrains Mono", "Consolas", monospace;
    }
    body[data-skin="robot"] .calendar-card,
    body[data-skin="robot"] .input-card,
    body[data-skin="robot"] .quick-card,
    body[data-skin="robot"] .todo-item { border-radius: 3px; border-color: #2b4034; }
    body[data-skin="robot"] h1 { background: none; -webkit-text-fill-color: #d8e8dd; letter-spacing: 5px; font-size: 20px; font-weight: 500; }
    body[data-skin="robot"] .subtitle { letter-spacing: 2px; text-transform: uppercase; font-size: 10px; }
    body[data-skin="robot"] .btn-add { border-radius: 3px; color: #080b09; font-weight: 700; letter-spacing: 1px; }
    body[data-skin="robot"] .filter-btn { border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
    body[data-skin="robot"] .filter-btn.active, body[data-skin="robot"] .cal-day.selected { color: #080b09; }
    body[data-skin="robot"] .cal-day { border-radius: 2px; }
    body[data-skin="robot"] .todo-item { position: relative; }
    body[data-skin="robot"] .todo-item::before,
    body[data-skin="robot"] .todo-item::after { content: ''; position: absolute; width: 3px; height: 3px; background: #3dff9e; opacity: .45; }
    body[data-skin="robot"] .todo-item::before { left: 5px; top: 5px; }
    body[data-skin="robot"] .todo-item::after { right: 5px; bottom: 5px; }
    body[data-skin="robot"] .checkbox { border-radius: 2px; }

    /* ---------- 4. 二次元 ---------- */
    body[data-skin="anime"] {
      --bg-primary: #241a2e; --bg-card: #33243f; --text-primary: #fff0f8;
      --text-secondary: #e0b8d4; --text-muted: #b08aa6; --border: #5c3f6b;
      --accent: #ff8ec7; --accent-light: rgba(255,142,199,.16); --accent-glow: rgba(255,142,199,.4);
      --danger: #ff6b8a; --success: #8ce99a;
      --shadow: 0 8px 28px rgba(255,142,199,.16);
      font-family: "Hiragino Sans", "Yu Gothic", "Microsoft YaHei", sans-serif;
    }
    body[data-skin="anime"] .calendar-card,
    body[data-skin="anime"] .input-card,
    body[data-skin="anime"] .todo-item { border-radius: 18px; }

  <script>
const STORAGE_KEY = 'todos_v3';
const COLLAPSED_KEY = 'todos_collapsed';

function formatDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function getYesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return formatDateKey(d);
}

function isPastDate(dateStr) {
  return dateStr < formatDateKey(new Date());
}

function formatDisplayDate(dateStr) {
  const date = new Date(dateStr);
  const today = formatDateKey(new Date());
  const yesterday = getYesterdayKey();
  if (dateStr === today) return '今天';
  if (dateStr === yesterday) return '昨天';
  return (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + ['周日','周一','周二','周三','周四','周五','周六'][date.getDay()];
}

function getDateTag(dateStr) {
  const today = formatDateKey(new Date());
  const yesterday = getYesterdayKey();
  if (dateStr === today) return '<span class="tag">今天</span>';
  if (dateStr === yesterday) return '<span class="tag yesterday">昨天</span>';
  return '';
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function formatFullTime(ts) {
  const d = new Date(ts);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + formatTime(ts);
}

function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

function loadCollapsed() {
  // 存储值损坏时不能让整个脚本挂掉：解析失败一律回落到空集合
  try {
    const raw = localStorage.getItem(COLLAPSED_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return new Set(Array.isArray(parsed) ? parsed.filter(v => typeof v === 'string') : []);
  } catch (e) {
    return new Set();
  }
}

let todos = [];
let currentFilter = 'all';
let currentMonth = new Date();
let selectedDate = formatDateKey(new Date());
let collapsedDates = loadCollapsed();

const todoInput = document.getElementById('todo-input');
const todoDate = document.getElementById('todo-date');
const addBtn = document.getElementById('add-btn');
const todoList = document.getElementById('todo-list');
const filterBtns = document.querySelectorAll('.filter-btn');
const clearBtn = document.getElementById('clear-btn');
const clearContainer = document.getElementById('clear-container');
const totalCount = document.getElementById('total-count');
const completedCount = document.getElementById('completed-count');
const remainingCount = document.getElementById('remaining-count');
const calTitle = document.getElementById('cal-title');
const calendarGrid = document.getElementById('calendar-grid');
const prevMonthBtn = document.getElementById('prev-month');
const nextMonthBtn = document.getElementById('next-month');
const todayBtn = document.getElementById('today-btn');

// 旧数据兼容层：读入时补齐缺失字段，避免旧记录缺 date 时归组键变成 "undefined"。
// 规则：id/text/date/createdAt 缺失或类型不对时补默认值；无法修复的条目直接丢弃，
// 但保留 text 与 date 齐全的记录，确保用户已有任务不丢。
const TODO_FIELDS = ['id', 'text', 'completed', 'createdAt', 'completedAt', 'date', 'labels'];

function normalizeTodo(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;

  const text = typeof raw.text === 'string' ? raw.text : (raw.text == null ? '' : String(raw.text));
  if (!text.trim()) return null;

  // date 必须是 YYYY-MM-DD；缺失或格式非法时回落到今天
  const date = typeof raw.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw.date) ? raw.date : formatDateKey(new Date());

  const id = (typeof raw.id === 'string' && raw.id) ? raw.id : generateId();
  const createdAt = (typeof raw.createdAt === 'number' && isFinite(raw.createdAt)) ? raw.createdAt : Date.now();
  const completed = raw.completed === true;
  // completedAt 仅在已完成时有意义；缺失则不补（render 依赖它可选）
  const completedAt = (completed && typeof raw.completedAt === 'number' && isFinite(raw.completedAt)) ? raw.completedAt : null;

  // 标签：存的是**标签 id**数组（不是名称）。
  // 旧数据没有该字段 → 补空数组；非数组 / 含非字符串 → 清洗成空数组或只留合法 id。
  // 名称与颜色在渲染时按 id 去标签表现查，所以改名/改色不必回写每条事项。
  const labels = Array.isArray(raw.labels)
    ? raw.labels.filter(v => typeof v === 'string' && v)
    : [];

  const todo = { id: id, text: text, completed: completed, createdAt: createdAt, completedAt: completedAt, date: date, labels: labels };
  // 保留未知字段（未来版本新增的、或用户自带的），回写时不能把它们抹掉
  Object.keys(raw).forEach(function (k) {
    if (TODO_FIELDS.indexOf(k) < 0) todo[k] = raw[k];
  });
  return todo;
}

// 判断一条记录是否与规范化结果等价。逐字段比较而非整串 JSON.stringify：
// 键顺序不同不算"有差异"，且 completedAt 的「缺失」与「null」视为等价
// —— addTodo 写入的记录本就没有 completedAt 键，若按键数比较会导致每次打开都回写。
// labels 是数组，必须逐元素比较：数组用 !== 比较的是引用，
// 两个内容相同的数组也会判为"有差异" → 每次打开页面都触发一次无谓回写。
function sameTodo(a, b) {
  if (!a || !b) return a === b;
  const keys = Object.keys(a).concat(Object.keys(b));
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    const va = a[k], vb = b[k];
    if (k === 'completedAt' && (va === null || va === undefined) && (vb === null || vb === undefined)) continue;
    if (k === 'labels') {
      // 「键缺失」等价于「空数组」；但「非数组的脏值」与「数组」必须判为有差异，才会触发回写清洗
      const la = va === undefined ? [] : va;
      const lb = vb === undefined ? [] : vb;
      const aIsArr = Array.isArray(la), bIsArr = Array.isArray(lb);
      if (aIsArr !== bIsArr) return false;
      if (!aIsArr) { if (la !== lb) return false; continue; }
      if (la.length !== lb.length) return false;
      for (let j = 0; j < la.length; j++) if (la[j] !== lb[j]) return false;
      continue;
    }
    if (va !== vb) return false;
  }
  return true;
}

function loadTodos() {
  const s = localStorage.getItem(STORAGE_KEY);
  if (!s) { todos = []; return; }
  let parsed;
  try { parsed = JSON.parse(s); } catch (e) { todos = []; return; }
  if (!Array.isArray(parsed)) { todos = []; return; }
  const normalized = parsed.map(normalizeTodo).filter(Boolean);
  todos = normalized;
  // 仅当确实发生过修正时才回写，避免每次打开都无谓写库
  // 注意：必须先赋值再回写，否则 saveTodos() 写的是旧值
  const changed = normalized.length !== parsed.length ||
    normalized.some(function (t, i) { return !sameTodo(t, parsed[i]); });
  if (changed) saveTodos();
}

function getGroupedTodos() {
  let filtered = currentFilter === 'active' ? todos.filter(x => !x.completed) :
                 currentFilter === 'completed' ? todos.filter(x => x.completed) : todos;
  // 标签筛选：只保留带该标签的事项（与状态筛选取交集）
  if (labelFilter) filtered = filtered.filter(t => t.labels && t.labels.indexOf(labelFilter) >= 0);
  const today = formatDateKey(new Date());
  const grouped = {};
  // 顺延口径：今天之前（任意日期，不只昨天）所有未完成任务，移入今天分组。
  // currentFilter === 'completed' 时不参与；'active' 下未完成项本就全部保留，无需额外顺延。
  if (currentFilter === 'completed') {
    filtered.forEach(t => { if (!grouped[t.date]) grouped[t.date] = []; grouped[t.date].push({...t, isContinued: false}); });
    return grouped;
  }
  const carried = [];
  filtered.forEach(t => {
    if (t.date < today && !t.completed) { carried.push({...t, isContinued: true, originDate: t.date}); return; }
    if (!grouped[t.date]) grouped[t.date] = [];
    grouped[t.date].push({...t, isContinued: false});
  });
  if (carried.length > 0) {
    if (!grouped[today]) grouped[today] = [];
    carried.sort((a, b) => a.date.localeCompare(b.date));
    carried.forEach(x => grouped[today].push(x));
  }
  return grouped;
}

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  calTitle.textContent = year + '年 ' + (month + 1) + '月';
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDow = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const today = formatDateKey(new Date());
  let html = '';
  const prevMonth = new Date(year, month, 0);
  const prevDays = prevMonth.getDate();
  for (let i = startDow - 1; i >= 0; i--) html += '<div class="cal-day other-month">' + (prevDays - i) + '</div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = formatDateKey(new Date(year, month, d));
    const classes = 'cal-day' + (dateKey === today ? ' today' : '') + (dateKey === selectedDate ? ' selected' : '') + (todos.some(t => t.date === dateKey) ? ' has-todos' : '');
    html += '<div class="' + classes + '" data-date="' + dateKey + '">' + d + '</div>';
  }
  const remaining = (startDow + daysInMonth) % 7;
  for (let d = 1; d < (remaining === 0 ? 0 : 7 - remaining); d++) html += '<div class="cal-day other-month">' + d + '</div>';
  calendarGrid.innerHTML = html;
  calendarGrid.querySelectorAll('.cal-day:not(.other-month)').forEach(el => {
    el.onclick = () => { selectedDate = el.dataset.date; todoDate.value = selectedDate; renderCalendar(); render(); };
  });
}

/* 分组的显示顺序：
     1) **今天永远置顶**
     2) 未来日期：**近的在前**（越近到期越靠上）
     3) 过去日期：近的在前
   为什么要有这套规则：原来只按日期倒序排，只要存在**未来日期**的分组
   （比如"下个月交报告"），它们就会排到今天前面 —— 今天和近期的分组反被压到最下面看不见。
   只把今天置顶还不够：未来分组内部若是"越远越靠前"，近期的任务同样会被远期的挡住。 */
function sortDateKeysForDisplay(keys, today) {
  return keys.slice().sort((a, b) => {
    if (a === today) return -1;
    if (b === today) return 1;
    const aFuture = a > today, bFuture = b > today;
    if (aFuture !== bFuture) return aFuture ? -1 : 1;   // 未来的排在过去的之前
    if (aFuture) return a.localeCompare(b);             // 未来：近的在前
    return b.localeCompare(a);                          // 过去：近的在前
  });
}

function render() {
  const grouped = getGroupedTodos();
  const today = formatDateKey(new Date());
  const dateKeys = sortDateKeysForDisplay(Object.keys(grouped), today);
  
  if (dateKeys.length === 0) {
    todoList.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><p>暂无任务</p></div>';
  } else {
    let html = '';
    dateKeys.forEach(dateKey => {
      const dayTodos = grouped[dateKey];
      const continued = dayTodos.filter(t => t.isContinued).length;
      const tag = getDateTag(dateKey);
      const subLabel = dateKey === today && continued > 0 ? ' <span style="color:#fb923c;font-size:10px">(含往期未完成 ' + continued + ' 项)</span>' : '';
      const isPast = isPastDate(dateKey);
      const isCollapsed = collapsedDates.has(dateKey);
      const hint = isPast && isCollapsed ? '<span class="collapsed-hint">(' + dayTodos.length + ' 项)</span>' : '';
      
      html += '<div class="date-section' + (isCollapsed ? ' collapsed' : '') + '" data-date="' + dateKey + '">';
      html += '<div class="date-label" onclick="toggleCollapse(\'' + dateKey + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg>' + formatDisplayDate(dateKey) + ' ' + tag + ' <span class="count">(' + dayTodos.length + ')' + subLabel + hint + '</span><span class="chevron">▼</span></div>';
      html += '<div class="todo-list">' + dayTodos.map(t => {
        const cls = 'todo-item' + (t.completed ? ' completed' : '') + (t.isContinued ? ' continued' : '');
        let timeHtml = '<div class="todo-time"><span>创建 ' + formatTime(t.createdAt) + '</span>';
        if (t.completed && t.completedAt) timeHtml += '<span class="completed-time">完成 ' + formatFullTime(t.completedAt) + '</span>';
        timeHtml += '</div>';
        if (t.isContinued) timeHtml = '<div class="todo-time"><span class="todo-source">来自 ' + formatDisplayDate(t.originDate) + '</span><span>创建 ' + formatTime(t.createdAt) + '</span></div>';
        return '<div class="' + cls + '" data-id="' + t.id + '"><div class="checkbox' + (t.completed ? ' checked' : '') + '" onclick="toggleTodo(\'' + t.id + '\')"></div><div class="todo-content"><div class="todo-date" onclick="changeDate(\'' + t.id + '\',\'' + t.date + '\')">' + formatDisplayDate(t.date) + '</div><div class="todo-text" ondblclick="startEdit(\'' + t.id + '\',\'' + escapeHtml(t.text).replace(/'/g, "\\'") + '\')">' + escapeHtml(t.text) + '</div><div class="todo-labels"></div>' + timeHtml + '</div><div class="todo-actions"><button class="btn-edit" onclick="startEdit(\'' + t.id + '\',\'' + escapeHtml(t.text).replace(/'/g, "\\'") + '\')" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="btn-delete" onclick="deleteTodo(\'' + t.id + '\')" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div></div>';
      }).join('') + '</div></div>';
    });
    todoList.innerHTML = html;
  }
  // 标签用 DOM API 单独渲染：名称来自标签表，用 textContent 写入，不做字符串拼接
  renderItemLabels();
  renderLabelFilterChip();
  clearContainer.style.display = todos.some(t => t.completed) ? 'block' : 'none';
  updateStats();
  syncInputClear();
}

todoInput.onkeydown = e => { if (e.key === 'Enter' && todoInput.value.trim()) { addTodo(todoInput.value, todoDate.value || formatDateKey(new Date())); todoInput.value = ''; syncInputClear(); } };

const QUICK_KEY = 'quick_phrases_v1';
const QUICK_COLLAPSED_KEY = 'quick_collapsed';
const QUICK_DEFAULTS = ['开会', '写报告', '打电话', '发邮件', '做方案'];

let quickPhrases = [];
let quickEditingIndex = -1;
let quickCollapsed = false;

const quickCard = document.getElementById('quick-card');
const quickHead = document.getElementById('quick-head');

function loadQuickPhrases() {
  const raw = localStorage.getItem(QUICK_KEY);
  if (raw === null) { quickPhrases = QUICK_DEFAULTS.slice(); return; }
  try {
    const parsed = JSON.parse(raw);
    quickPhrases = Array.isArray(parsed)
      ? parsed.filter(p => typeof p === 'string' && p.trim())
      : QUICK_DEFAULTS.slice();
  } catch (e) {
    quickPhrases = QUICK_DEFAULTS.slice();
  }
}

function saveQuickPhrases() {
  try { localStorage.setItem(QUICK_KEY, JSON.stringify(quickPhrases)); } catch (e) {}
}

// 全部用 DOM API + textContent 构建，不做字符串拼接，避免引号/HTML 转义类 bug
function renderQuickPhrases() {
  quickChips.innerHTML = '';
  quickPhrases.forEach((phrase, index) => {
    const chip = document.createElement('div');
    chip.className = 'quick-chip';
    chip.title = '点击填入输入框';

    const label = document.createElement('span');
    label.textContent = phrase;
    chip.appendChild(label);

    const actions = document.createElement('span');
    actions.className = 'quick-chip-actions';

    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'quick-chip-btn edit';
    editBtn.textContent = '改';
    editBtn.title = '编辑';
    editBtn.addEventListener('click', ev => { ev.stopPropagation(); openQuickEditor(index); });

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'quick-chip-btn del';
    delBtn.textContent = '删';
    delBtn.title = '删除';
    delBtn.addEventListener('click', ev => { ev.stopPropagation(); deleteQuickPhrase(index); });

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    chip.appendChild(actions);
    chip.addEventListener('click', () => useQuickPhrase(index));
    quickChips.appendChild(chip);
  });

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'quick-add';
  addBtn.textContent = '+ 添加';
  addBtn.addEventListener('click', () => openQuickEditor(-1));
  quickChips.appendChild(addBtn);

  quickCount.textContent = quickPhrases.length ? '(' + quickPhrases.length + ')' : '';
}

function useQuickPhrase(index) {
  const phrase = quickPhrases[index];
  if (typeof phrase !== 'string') return;
  todoInput.value = phrase;
  todoInput.focus();
  syncInputClear();
  const len = phrase.length;
  try { todoInput.setSelectionRange(len, len); } catch (e) {}
}

function openQuickEditor(index) {
  quickEditingIndex = typeof index === 'number' ? index : -1;
  quickInput.value = quickEditingIndex >= 0 ? (quickPhrases[quickEditingIndex] || '') : '';
  quickEditor.classList.add('show');
  quickInput.focus();
  try { quickInput.setSelectionRange(quickInput.value.length, quickInput.value.length); } catch (e) {}
}

function closeQuickEditor() {
  quickEditingIndex = -1;
  quickInput.value = '';
  quickEditor.classList.remove('show');
}

function commitQuickPhrase() {
  const text = quickInput.value.trim();
  if (!text) { quickInput.focus(); return; }
  if (quickEditingIndex >= 0 && quickEditingIndex < quickPhrases.length) {
    quickPhrases[quickEditingIndex] = text;
  } else {
    quickPhrases.push(text);
  }
  saveQuickPhrases();
  closeQuickEditor();
  renderQuickPhrases();
}

function deleteQuickPhrase(index) {
  if (index < 0 || index >= quickPhrases.length) return;
  quickPhrases.splice(index, 1);
  saveQuickPhrases();
  if (quickEditingIndex === index) closeQuickEditor();
  else if (quickEditingIndex > index) quickEditingIndex -= 1;
  renderQuickPhrases();
}

function toggleQuickPanel() {
  quickCollapsed = !quickCollapsed;
  quickCard.classList.toggle('collapsed', quickCollapsed);
  try { localStorage.setItem(QUICK_COLLAPSED_KEY, quickCollapsed ? '1' : '0'); } catch (e) {}
}

quickSaveBtn.addEventListener('click', commitQuickPhrase);
quickCancelBtn.addEventListener('click', closeQuickEditor);
quickInput.addEventListener('keydown', e => {

/* ---------- 风格皮肤：切换器常驻，默认紫，选择持久化 ---------- */
(function () {
  const SKIN_KEY = 'todo_skin';
  const SKINS = ['violet', 'cartoon', 'cyber', 'robot', 'anime', 'ink'];
  const bar = document.querySelector('.skin-bar');
  if (!bar) return;
  const btns = Array.prototype.slice.call(bar.querySelectorAll('.skin-btn'));

  function normalize(name) {
    if (name === 'lab') return 'violet';
    return SKINS.indexOf(name) >= 0 ? name : 'violet';
  }

  // 唯一的状态出口：改 body 属性 + 同步按钮高亮。定时切换时直接调用它即可。
  function apply(name) {
    const skin = normalize(name);
    if (skin === 'violet') document.body.removeAttribute('data-skin');
    else document.body.setAttribute('data-skin', skin);
    btns.forEach(b => b.classList.toggle('active', b.dataset.skin === skin));
    return skin;
  }

  function remember(skin) {
    try { localStorage.setItem(SKIN_KEY, skin); } catch (e) {}
  }

  let initial = 'violet';
  try {
    const param = new URLSearchParams(location.search).get('skin');
    const stored = localStorage.getItem(SKIN_KEY);
    initial = normalize(param || stored || 'violet');
  } catch (e) {}

  apply(initial);

  bar.addEventListener('click', e => {
    const b = e.target.closest('.skin-btn');
    if (!b) return;
    remember(apply(b.dataset.skin));
  });
})();

];

let labels = [];
let labelEditingId = null;          // null = 新增；字符串 = 正在编辑的标签 id
let labelEditingColor = LABEL_PALETTE[4];
let labelEditingName = '';          // 打开编辑器时的原名（点「取消」时回滚用）
let labelPendingDelete = null;      // 已点「删」、等待二次确认的标签 id
let labelFilter = null;             // 当前标签筛选（标签 id），null = 不筛
let labelCollapsed = false;

const labelCard = document.getElementById('label-card');
const labelHead = document.getElementById('label-head');
const labelList = document.getElementById('label-list');
const labelCount = document.getElementById('label-count');
const labelEditor = document.getElementById('label-editor');
const labelInput = document.getElementById('label-input');
const labelPalette = document.getElementById('label-palette');
const labelError = document.getElementById('label-error');
const labelSaveBtn = document.getElementById('label-save');
const labelCancelBtn = document.getElementById('label-cancel');

function loadLabels() {
  try {
    const raw = localStorage.getItem(LABEL_KEY);
    if (raw !== null) {
      const parsed = JSON.parse(raw);
      // 键存在且是数组就用它——哪怕是空数组：用户可能把标签删光了，不该又冒出内置的
      if (Array.isArray(parsed)) {
        labels = parsed.filter(x => x && x.id).map(x => ({
          id: String(x.id),
          name: String(x.name == null ? x.id : x.name),
          color: /^#[0-9a-fA-F]{6}$/.test(x.color) ? x.color : '#7d879c'
        }));
        return;
      }
    }
  } catch (e) {}
  labels = LABEL_DEFAULTS.map(x => ({ id: x.id, name: x.name, color: x.color }));
  saveLabels();
}

function saveLabels() {
  try { localStorage.setItem(LABEL_KEY, JSON.stringify(labels)); } catch (e) {}
}

/* 面板的临时状态（正在编辑哪个标签、待确认删除哪个标签）也落库：
   刷新页面后编辑框与确认条还在，不会让用户"填了一半就没了"。 */
function loadLabelUI() {
  try {
    const raw = localStorage.getItem(LABEL_UI_KEY);
    const d = raw ? JSON.parse(raw) : null;
    if (d && typeof d === 'object' && !Array.isArray(d)) {
      labelEditingId = typeof d.editingId === 'string' ? d.editingId : null;
      labelEditingColor = /^#[0-9a-fA-F]{6}$/.test(d.editingColor) ? d.editingColor : LABEL_PALETTE[4];
      labelEditingName = typeof d.editingName === 'string' ? d.editingName : '';
      labelPendingDelete = typeof d.pendingDelete === 'string' ? d.pendingDelete : null;
      labelFilter = typeof d.filter === 'string' ? d.filter : null;
      // 标签可能已被删（换了浏览器 / 清了标签表），筛选自动失效
      if (labelFilter && !labels.some(l => l.id === labelFilter)) labelFilter = null;
    }
  } catch (e) {}
}

function saveLabelUI() {
  try {
    localStorage.setItem(LABEL_UI_KEY, JSON.stringify({
      editingId: labelEditingId,
      editingColor: labelEditingColor,
      editingName: labelEditingName,
      pendingDelete: labelPendingDelete,
      filter: labelFilter
    }));
  } catch (e) {}
}

function labelDef(id) { return labels.find(l => l.id === id) || null; }
function labelName(id) { const d = labelDef(id); return d ? d.name : id; }
function labelColor(id, fb) { const d = labelDef(id); return d ? d.color : (fb || '#7d879c'); }
function labelExists(id) { return !!labelDef(id); }

/* 亮度判断：只有确实很浅的底色才改用深色字（阈值取 185，
   正好覆盖内置的黄色 #f5c451，其余内置色维持白字） */
function isLight(hex) {
  const h = String(hex || '').replace('#', '');
  if (h.length < 6) return false;
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 185;
}

/* 清掉指向已删除标签的悬空引用（标签被删后事项不应再挂着无效 id） */
function pruneDanglingLabels() {
  let changed = false;
  todos.forEach(t => {
    if (t.labels && t.labels.length) {
      const keep = t.labels.filter(id => labelExists(id));
      if (keep.length !== t.labels.length) { t.labels = keep; changed = true; }
    }
  });
  if (changed) saveTodos();
}

/* ---------- 标签管理面板 ---------- */
function renderLabelPanel() {
  labelList.innerHTML = '';
  labels.forEach(l => {
    const row = document.createElement('div');
    row.className = 'label-row' + (labelFilter === l.id ? ' filtering' : '');
    row.draggable = true;
    row.dataset.labelId = l.id;
    row.title = '点一下只看该标签的事项；按住可拖到任务上';

    const dot = document.createElement('span');
    dot.className = 'label-dot';
    dot.style.background = l.color;

    const name = document.createElement('span');
    name.className = 'label-name';
    name.textContent = l.name;

    // 该标签下有多少个事项（顺带告诉用户哪些标签值得筛）
    const used = todos.filter(t => (t.labels || []).indexOf(l.id) >= 0).length;
    const count = document.createElement('span');
    count.className = 'label-row-count' + (used ? '' : ' zero');
    count.textContent = '(' + used + ')';

    const actions = document.createElement('span');
    actions.className = 'label-row-actions';

    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'label-row-btn edit';
    editBtn.textContent = '改';
    editBtn.title = '改名 / 改色';
    editBtn.addEventListener('click', ev => { ev.stopPropagation(); openLabelEditor(l.id); });

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'label-row-btn del';
    delBtn.textContent = '删';
    delBtn.title = '删除标签（会从所有任务上移除）';
    delBtn.addEventListener('click', ev => { ev.stopPropagation(); requestDelete(l.id); });

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(count);
    row.appendChild(actions);

    // 点标签行 = 切换筛选。按下与抬起位置差得多说明是在拖动，不能当成点击。
    let downX = 0, downY = 0;
    row.addEventListener('mousedown', e => { downX = e.clientX; downY = e.clientY; });
    row.addEventListener('click', e => {
      if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) return;
      toggleLabelFilter(l.id);
    });

    row.addEventListener('dragstart', onLabelDragStart);
    row.addEventListener('dragend', onLabelDragEnd);
    labelList.appendChild(row);

    // 已点「删」但还没确认：在这行下面展开一条二次确认条
    if (labelPendingDelete === l.id) {
      const used = todos.filter(t => (t.labels || []).indexOf(l.id) >= 0).length;
      const strip = document.createElement('div');
      strip.className = 'label-confirm';
      const txt = document.createElement('span');
      txt.className = 'label-confirm-text';
      txt.textContent = '确定删除「' + l.name + '」？' +
        (used ? ('该标签正被 ' + used + ' 个任务使用，删除后这些任务会移除该标签。')
              : '该标签暂未被任何任务使用。');
      const okBtn = document.createElement('button');
      okBtn.type = 'button';
      okBtn.className = 'label-confirm-ok';
      okBtn.textContent = '删除';
      okBtn.addEventListener('click', ev => { ev.stopPropagation(); doDelete(l.id); });
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'label-confirm-cancel';
      cancelBtn.textContent = '取消';
      cancelBtn.addEventListener('click', ev => { ev.stopPropagation(); cancelDelete(); });
      strip.appendChild(txt);
      strip.appendChild(okBtn);
      strip.appendChild(cancelBtn);
      labelList.appendChild(strip);
    }
  });

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'label-add';
  addBtn.textContent = '+ 添加标签';
  addBtn.addEventListener('click', () => openLabelEditor(null));
  labelList.appendChild(addBtn);

  labelCount.textContent = labels.length ? '(' + labels.length + ')' : '';
}

function renderLabelPalette() {
  labelPalette.innerHTML = '';
  LABEL_PALETTE.forEach(c => {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'label-sw' + (String(labelEditingColor).toLowerCase() === c.toLowerCase() ? ' on' : '');
    sw.style.background = c;
    sw.title = c;
    sw.addEventListener('click', () => { setLabelColor(c); });
    labelPalette.appendChild(sw);
  });
  const custom = document.createElement('input');
  custom.type = 'color';
  custom.className = 'label-custom';
  custom.value = labelEditingColor;
  custom.title = '自定义颜色';
  custom.addEventListener('input', () => { setLabelColor(custom.value); });
  labelPalette.appendChild(custom);
}

function showLabelError(msg) {
  labelError.textContent = msg;
  labelError.classList.toggle('show', !!msg);
}

/* 刷新后把上次没关掉的编辑框 / 确认条恢复出来（状态存在 label_ui_v1 里） */
function restoreLabelEditor() {
  if (labelEditingId && !labelDef(labelEditingId)) { labelEditingId = null; labelEditingName = ''; }
  if (labelPendingDelete && !labelDef(labelPendingDelete)) labelPendingDelete = null;
  if (labelEditingId) {
    const d = labelDef(labelEditingId);
    labelInput.value = d.name;
    labelEditingColor = d.color;
    renderLabelPalette();
    labelEditor.classList.add('show');
  }
}

/* 实时改名/改色后，就地更新面板那一行的文字与色块。
   注意不能调 renderLabelPanel()——那会把编辑器整个重建掉，正在输入的焦点就没了。 */
function syncLabelRow(id) {
  const row = labelList.querySelector('.label-row[data-label-id="' + id + '"]');
  if (!row) return;
  const d = labelDef(id);
  if (!d) return;
  const nm = row.querySelector('.label-name');
  if (nm) nm.textContent = d.name;
  const dot = row.querySelector('.label-dot');
  if (dot) dot.style.background = d.color;
}

function openLabelEditor(id) {
  labelEditingId = (typeof id === 'string') ? id : null;
  const d = labelEditingId ? labelDef(labelEditingId) : null;
  labelEditingName = d ? d.name : '';          // 记下原名，点「取消」时回滚
  labelInput.value = labelEditingName;
  labelEditingColor = d ? d.color : LABEL_PALETTE[4];
  showLabelError('');
  renderLabelPalette();
  labelEditor.classList.add('show');
  saveLabelUI();
  labelInput.focus();
  try { labelInput.setSelectionRange(labelInput.value.length, labelInput.value.length); } catch (e) {}
}

function closeLabelEditor(revert) {
  if (revert && labelEditingId) {
    // 取消：把名称与颜色回滚到打开编辑器时的样子
    const d = labelDef(labelEditingId);
    if (d) { d.name = labelEditingName; d.color = labelEditingColor; saveLabels(); }
  }
  labelEditingId = null;
  labelInput.value = '';
  labelEditor.classList.remove('show');
  showLabelError('');
  saveLabelUI();
  renderLabelPanel();
  render();
}

function commitLabel() {
  const name = labelInput.value.trim();
  if (!name) { showLabelError('标签名不能为空'); labelInput.focus(); return; }
  if (labelEditingId) {
    const d = labelDef(labelEditingId);
    if (!d) { closeLabelEditor(false); return; }
    if (labels.some(l => l.id !== labelEditingId && l.name === name)) {
      showLabelError('已存在同名标签「' + name + '」');
      return;
    }
    d.name = name;
    d.color = labelEditingColor;
    saveLabels();
    saveLabelUI();
    closeLabelEditor(false);
    return;
  }
  if (labels.some(l => l.name === name)) { showLabelError('已存在同名标签「' + name + '」'); return; }
  labels.push({ id: 'lbl_' + generateId(), name: name, color: labelEditingColor });
  saveLabels();
  closeLabelEditor(false);
}

/* 选色即生效：改的是标签表里的一处，事项里的 chip 按 id 现查，自动跟着变 */
function setLabelColor(c) {
  if (!c) return;
  labelEditingColor = c;
  saveLabelUI();
  renderLabelPalette();
  if (labelEditingId) {
    const d = labelDef(labelEditingId);
    if (d && d.color !== c) { d.color = c; saveLabels(); syncLabelRow(labelEditingId); render(); }
  }
}

/* 删除走**两步**，不用原生 confirm()：
   原生弹窗在嵌入式浏览器里可能被自动 dismiss（点了没反应），样式也和整套皮肤不搭。
   第一步点「删」→ 在面板里展开二次确认条（状态落库，刷新不丢）；第二步才真删。 */
function requestDelete(id) {
  if (!labelDef(id)) return;
  labelPendingDelete = id;
  saveLabelUI();
  renderLabelPanel();
}

function cancelDelete() {
  labelPendingDelete = null;
  saveLabelUI();
  renderLabelPanel();
}

/* 真删：标签表里移除，并从**所有**任务上清掉这个引用 */
function doDelete(id) {
  const d = labelDef(id);
  if (!d) return;
  labels = labels.filter(l => l.id !== id);
  saveLabels();
  if (labelPendingDelete === id) labelPendingDelete = null;   // 待确认条关掉
  if (labelFilter === id) labelFilter = null;                 // 正在筛的标签被删了，筛选自动失效
  saveLabelUI();
  let changed = false;
  todos.forEach(t => {
    if (t.labels && t.labels.indexOf(id) >= 0) {
      t.labels = t.labels.filter(x => x !== id);
      changed = true;
    }
  });
  if (changed) saveTodos();
  if (labelEditingId === id) closeLabelEditor(false);
  renderLabelPanel();
  render();
}

function toggleLabelPanel() {
  labelCollapsed = !labelCollapsed;
  labelCard.classList.toggle('collapsed', labelCollapsed);
  try { localStorage.setItem(LABEL_COLLAPSED_KEY, labelCollapsed ? '1' : '0'); } catch (e) {}
}

labelHead.addEventListener('click', toggleLabelPanel);
labelSaveBtn.addEventListener('click', commitLabel);
labelCancelBtn.addEventListener('click', () => closeLabelEditor(true));

/* 输入即改：改名实时生效，事项里的 chip 按 id 现查，名字立刻跟着变。
   （同时被校验拦下：空名 / 与别的标签重名都不写入）
   input 与 change 都监听：前者覆盖逐字输入，后者覆盖粘贴 / 中文输入法上屏。 */
function applyLiveName() {
  if (!labelEditingId) return;
  const d = labelDef(labelEditingId);
  if (!d) return;
  const name = labelInput.value.trim();
  if (!name) { showLabelError('标签名不能为空'); return; }
  if (labels.some(l => l.id !== labelEditingId && l.name === name)) {
    showLabelError('已存在同名标签「' + name + '」');
    return;
  }
  showLabelError('');
  if (d.name !== name) { d.name = name; saveLabels(); syncLabelRow(labelEditingId); render(); }
}
labelInput.addEventListener('input', applyLiveName);
labelInput.addEventListener('change', applyLiveName);

/* 中文输入法组词过程中的 Enter 不能当成提交 */
let labelComposing = false;
labelInput.addEventListener('compositionstart', () => { labelComposing = true; });
labelInput.addEventListener('compositionend', () => { labelComposing = false; });
labelInput.addEventListener('keydown', e => {
  if (labelComposing) return;
  if (e.key === 'Enter') { e.preventDefault(); commitLabel(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeLabelEditor(true); }
});

/* ---------- 事项内的标签 ---------- */
function renderItemLabels() {
  const byId = {};
  todos.forEach(t => { byId[t.id] = t; });
  todoList.querySelectorAll('.todo-item').forEach(itemEl => {
    const box = itemEl.querySelector('.todo-labels');
    if (!box) return;
    box.innerHTML = '';
    const t = byId[itemEl.dataset.id];
    if (!t || !t.labels) return;
    t.labels.forEach(lid => {
      const def = labelDef(lid);
      if (!def) return;                    // 悬空引用不渲染
      const chip = document.createElement('span');
      chip.className = 'todo-lbl' + (isLight(def.color) ? ' dark' : '');
      chip.style.background = def.color;
      const name = document.createElement('span');
      name.textContent = def.name;
      chip.appendChild(name);
      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'todo-lbl-x';
      x.textContent = '×';
      x.title = '从该任务移除此标签';
      x.addEventListener('click', ev => { ev.stopPropagation(); removeLabelFromTodo(t.id, lid); });
      chip.appendChild(x);
      box.appendChild(chip);
    });
  });
}

function addLabelToTodo(todoId, labelId) {
  const t = todos.find(x => x.id === todoId);
  if (!t || !labelExists(labelId)) return;
  if (!Array.isArray(t.labels)) t.labels = [];
  if (t.labels.indexOf(labelId) >= 0) return;
  t.labels.push(labelId);
  saveTodos();
  render();
  renderLabelPanel();   // 面板上的「该标签有多少事项」计数要跟着变
}

function removeLabelFromTodo(todoId, labelId) {
  const t = todos.find(x => x.id === todoId);
  if (!t || !Array.isArray(t.labels)) return;
  const i = t.labels.indexOf(labelId);
  if (i < 0) return;
  t.labels.splice(i, 1);
  saveTodos();
  render();
  renderLabelPanel();
}

/* ---------- 拖放：把全局标签拖到某个任务上 ---------- */
let dropTargetEl = null;

function clearDropHighlight() {
  if (dropTargetEl) { dropTargetEl.classList.remove('drop-target'); dropTargetEl = null; }
}

function onLabelDragStart(e) {
  e.dataTransfer.setData('text/plain', this.dataset.labelId);
  e.dataTransfer.effectAllowed = 'copy';
  this.classList.add('dragging');
}

function onLabelDragEnd(e) {
  this.classList.remove('dragging');
  clearDropHighlight();
}

todoList.addEventListener('dragover', e => {
  const item = e.target.closest ? e.target.closest('.todo-item') : null;
  if (!item) return;                       // 不在任务上：不 preventDefault，浏览器不会触发 drop
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  if (dropTargetEl !== item) {
    clearDropHighlight();
    item.classList.add('drop-target');
    dropTargetEl = item;
  }
});

todoList.addEventListener('dragleave', e => {
  const item = e.target.closest ? e.target.closest('.todo-item') : null;
  if (!item) return;
  // 在任务内部的子元素之间移动也会冒泡 dragleave，用 relatedTarget 判断是否真的离开了这个任务
  if (e.relatedTarget && item.contains(e.relatedTarget)) return;
  if (item === dropTargetEl) clearDropHighlight();
});

todoList.addEventListener('drop', e => {
  e.preventDefault();
  const item = e.target.closest ? e.target.closest('.todo-item') : null;
  clearDropHighlight();
  if (!item) return;
  const id = e.dataTransfer.getData('text/plain');
  if (!id) return;
  addLabelToTodo(item.dataset.id, id);
});

todoDate.value = selectedDate;
loadLabels();
loadTodos();
pruneDanglingLabels();
labelCollapsed = localStorage.getItem(LABEL_COLLAPSED_KEY) === '1';
labelCard.classList.toggle('collapsed', labelCollapsed);
loadLabelUI();
restoreLabelEditor();
renderLabelPanel();
renderCalendar();
render();
  </script>
