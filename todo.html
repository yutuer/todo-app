<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0f0f10; --bg-card: #1c1c1f; --text-primary: #fafafa;
      --text-secondary: #a1a1aa; --text-muted: #71717a; --border: #27272a;
      --accent: #8b5cf6; --accent-light: rgba(139,92,246,0.15);
      --accent-glow: rgba(139,92,246,0.3); --danger: #f87171; --success: #4ade80; --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    [data-theme="cyan"] { --accent: #06b6d4; --accent-light: rgba(6,182,212,0.15); --accent-glow: rgba(6,182,212,0.3); }
    [data-theme="coral"] { --accent: #f97316; --accent-light: rgba(249,115,22,0.15); --accent-glow: rgba(249,115,22,0.3); }
    [data-theme="rose"] { --accent: #ec4899; --accent-light: rgba(236,72,153,0.15); --accent-glow: rgba(236,72,153,0.3); }
    [data-theme="emerald"] { --accent: #10b981; --accent-light: rgba(16,185,129,0.15); --accent-glow: rgba(16,185,129,0.3); }
    body { font-family: Inter, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding: 24px; }
    .layout { display: flex; gap: 20px; max-width: 1100px; margin: 0 auto; }
    .sidebar { width: 200px; flex-shrink: 0; }
    .main { flex: 1; min-width: 0; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg,var(--text-primary),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: var(--text-secondary); font-size: 12px; }
    .theme-switcher { display: flex; justify-content: center; gap: 8px; margin-top: 12px; padding: 10px; background: var(--bg-card); border-radius: 50px; width: fit-content; margin-left: auto; margin-right: auto; border: 1px solid var(--border); }
    .theme-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
    .theme-dot:hover { transform: scale(1.15); }
    .theme-dot.active { border-color: var(--text-primary); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-glow); }
    .theme-dot[data-theme="violet"] { background: linear-gradient(135deg,#8b5cf6,#7c3aed); }
    .theme-dot[data-theme="cyan"] { background: linear-gradient(135deg,#06b6d4,#0891b2); }
    .theme-dot[data-theme="coral"] { background: linear-gradient(135deg,#f97316,#ea580c); }
    .theme-dot[data-theme="rose"] { background: linear-gradient(135deg,#ec4899,#db2777); }
    .theme-dot[data-theme="emerald"] { background: linear-gradient(135deg,#10b981,#059669); }
    .calendar-card { background: var(--bg-card); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); position: sticky; top: 24px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cal-title { font-size: 13px; font-weight: 600; }
    .cal-nav { width: 26px; height: 26px; border: 1px solid var(--border); background: var(--bg-primary); border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
    .cal-nav:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; margin-bottom: 4px; }
    .calendar-weekdays span { font-size: 9px; color: var(--text-muted); padding: 3px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 6px; cursor: pointer; transition: all 0.15s; position: relative; color: var(--text-secondary); }
    .cal-day:hover { background: var(--border); color: var(--text-primary); }
    .cal-day.other-month { color: var(--text-muted); opacity: 0.35; }
    .cal-day.today { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .cal-day.selected { background: linear-gradient(135deg,var(--accent),var(--accent)); color: white; font-weight: 600; }
    .cal-day.has-todos::after { content: ''; position: absolute; bottom: 3px; width: 3px; height: 3px; background: var(--accent); border-radius: 50%; }
    .cal-day.selected.has-todos::after { background: white; }
    .today-btn { width: 100%; margin-top: 10px; padding: 8px; background: var(--accent-light); border: 1px solid var(--accent-glow); border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--accent); cursor: pointer; font-family: inherit; }
    .today-btn:hover { background: var(--accent); color: white; }
    .stats { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat-value { font-size: 22px; font-weight: 700; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
    .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .input-card { background: var(--bg-card); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--border); }
    .input-row { display: flex; gap: 8px; }
    input[type="date"] { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; cursor: pointer; background: var(--bg-primary); color: var(--text-primary); }
    input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--bg-primary); color: var(--text-primary); outline: none; }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    input[type="text"]::placeholder { color: var(--text-muted); }
    .btn-add { padding: 10px 16px; background: linear-gradient(135deg,var(--accent),var(--accent)); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px var(--accent-glow); font-family: inherit; }
    .btn-add:hover { transform: translateY(-1px); }
    .filters { display: flex; gap: 6px; margin-bottom: 14px; }
    .filter-btn { padding: 7px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .filter-btn:hover { border-color: var(--text-muted); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .date-section { margin-bottom: 14px; }
    .date-section.collapsed .todo-list { display: none; }
    .date-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.2s; }
    .date-label:hover { background: var(--bg-card); }
    .date-label svg { width: 12px; height: 12px; color: var(--accent); transition: transform 0.2s; }
    .date-section.collapsed .date-label svg { transform: rotate(-90deg); }
    .date-label .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--accent-light); color: var(--accent); font-weight: 500; }
    .date-label .tag.yesterday { background: rgba(251,146,60,0.15); color: #fb923c; }
    .date-label .count { font-size: 10px; color: var(--text-muted); }
    .date-label .chevron { margin-left: auto; font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
    .date-section.collapsed .date-label .chevron { transform: rotate(-90deg); }
    .date-label .collapsed-hint { font-size: 10px; color: var(--text-muted); margin-left: 8px; }
    .todo-list { display: flex; flex-direction: column; gap: 6px; }
    .todo-item { background: var(--bg-card); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); }
    .todo-item.continued { border-left: 3px solid #fb923c; }
    .todo-item.completed { opacity: 0.7; }
    .checkbox { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
    .checkbox:hover { border-color: var(--accent); }
    .checkbox.checked { background: var(--success); border-color: var(--success); }
    .checkbox.checked::after { content: ''; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .todo-content { flex: 1; min-width: 0; }
    .todo-date { font-size: 10px; color: var(--accent); cursor: pointer; margin-bottom: 2px; }
    .todo-date:hover { text-decoration: underline; }
    .todo-text { font-size: 13px; line-height: 1.4; word-break: break-word; }
    .todo-item.completed .todo-text { color: var(--text-muted); text-decoration: line-through; }
    .todo-time { font-size: 10px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; }
    .todo-time .completed-time { color: var(--success); }
    .todo-source { font-size: 10px; color: #fb923c; }
    .todo-actions { display: flex; gap: 4px; opacity: 0; }
    .todo-item:hover .todo-actions { opacity: 1; }
    .btn-edit, .btn-delete { width: 28px; height: 28px; border: none; background: transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
    .btn-edit:hover { background: var(--accent-light); color: var(--accent); }
    .btn-delete:hover { background: rgba(248,113,113,0.1); color: var(--danger); }
    .btn-edit svg, .btn-delete svg { width: 14px; height: 14px; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state svg { width: 44px; height: 44px; margin-bottom: 12px; opacity: 0.4; color: var(--accent); }
    .clear-completed { margin-top: 16px; text-align: center; }
    .btn-clear { padding: 8px 16px; background: transparent; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .btn-clear:hover { border-color: var(--danger); color: var(--danger); }
    @media (max-width: 768px) { body { padding: 16px; } .layout { flex-direction: column; } .sidebar { width: 100%; } .calendar-card { position: static; } .input-row { flex-direction: column; } .btn-add { width: 100%; } .todo-actions { opacity: 1; } }
  .quick-panel{background:var(--bg-card);border-radius:12px;padding:14px;border:1px solid var(--border);margin-top:16px}.quick-panel-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}.quick-panel-title svg{width:12px;height:12px}.quick-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}.quick-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-secondary);border-radius:8px;cursor:pointer;transition:all 0.2s;border:1px solid transparent;font-size:12px;color:var(--text-primary)}.quick-item:hover{background:var(--bg-hover);border-color:var(--accent)}.quick-item-count{font-size:10px;color:var(--text-muted);background:var(--bg-hover);padding:1px 5px;border-radius:8px;margin-left:auto}.quick-item-actions{display:none;gap:4px}.quick-item:hover .quick-item-count{display:none}.quick-item:hover .quick-item-actions{display:flex}.quick-action-btn{width:20px;height:20px;border:none;background:var(--bg-card);border-radius:4px;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}.quick-action-btn:hover{background:var(--accent);color:white}.quick-action-btn.delete:hover{background:var(--danger)}.quick-action-btn svg{width:10px;height:10px}.quick-add-btn{width:100%;margin-top:8px;padding:8px;border:1px dashed var(--border);background:transparent;border-radius:8px;color:var(--text-muted);font-size:12px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:4px}.quick-add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}.quick-add-btn svg{width:12px;height:12px}</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="calendar-card">
        <div class="calendar-header">
          <button class="cal-nav" id="prev-month">&lt;</button>
          <span class="cal-title" id="cal-title"></span>
          <button class="cal-nav" id="next-month">&gt;</button>
        </div>
        <div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="calendar-grid" id="calendar-grid"></div>
        <button class="today-btn" id="today-btn">今天</button>
      </div>
    <div class="quick-panel"><div class="quick-panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M13 2v7h7"/></svg>快捷语</div><div class="quick-list" id="quick-list"></div><button class="quick-add-btn" id="quick-add-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>添加</button></div></aside>
    <main class="main">
      <header>
        <h1>待办事项</h1>
        <p class="subtitle">记录每天要完成的任务</p>
        <div class="theme-switcher" id="theme-switcher">
          <div class="theme-dot active" data-theme="violet"></div>
          <div class="theme-dot" data-theme="cyan"></div>
          <div class="theme-dot" data-theme="coral"></div>
          <div class="theme-dot" data-theme="rose"></div>
          <div class="theme-dot" data-theme="emerald"></div>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-value" id="total-count">0</div><div class="stat-label">总计</div></div>
          <div class="stat"><div class="stat-value" id="completed-count">0</div><div class="stat-label">已完成</div></div>
          <div class="stat"><div class="stat-value" id="remaining-count">0</div><div class="stat-label">剩余</div></div>
        </div>
      </header>
      <div class="input-card">
        <div class="input-row">
          <input type="date" id="todo-date">
          <input type="text" id="todo-input" placeholder="添加新任务..." maxlength="200">
          <button class="btn-add" id="add-btn">添加</button>
        </div>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="active">进行中</button>
        <button class="filter-btn" data-filter="completed">已完成</button>
      </div>
      <div class="todo-list" id="todo-list"></div>
      <div class="clear-completed" id="clear-container" style="display:none;"><button class="btn-clear" id="clear-btn">清除已完成</button></div>
    </main>
  </div>
  <script>
const STORAGE_KEY = 'todos_v3';
const THEME_KEY = 'todo_theme';
const COLLAPSED_KEY = 'todos_collapsed';

function formatDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function getYesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return formatDateKey(d);
}

function isPastDate(dateStr) {
  return dateStr < formatDateKey(new Date());
}

function formatDisplayDate(dateStr) {
  const date = new Date(dateStr);
  const today = formatDateKey(new Date());
  const yesterday = getYesterdayKey();
  if (dateStr === today) return '今天';
  if (dateStr === yesterday) return '昨天';
  return (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + ['周日','周一','周二','周三','周四','周五','周六'][date.getDay()];
}

function getDateTag(dateStr) {
  const today = formatDateKey(new Date());
  const yesterday = getYesterdayKey();
  if (dateStr === today) return '<span class="tag">今天</span>';
  if (dateStr === yesterday) return '<span class="tag yesterday">昨天</span>';
  return '';
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function formatFullTime(ts) {
  const d = new Date(ts);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + formatTime(ts);
}

function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

let todos = [];
let currentFilter = 'all';
let currentMonth = new Date();
let selectedDate = formatDateKey(new Date());
let collapsedDates = new Set(JSON.parse(localStorage.getItem(COLLAPSED_KEY) || '[]'));

const todoInput = document.getElementById('todo-input');
const todoDate = document.getElementById('todo-date');
const addBtn = document.getElementById('add-btn');
const todoList = document.getElementById('todo-list');
const filterBtns = document.querySelectorAll('.filter-btn');
const clearBtn = document.getElementById('clear-btn');
const clearContainer = document.getElementById('clear-container');
const totalCount = document.getElementById('total-count');
const completedCount = document.getElementById('completed-count');
const remainingCount = document.getElementById('remaining-count');
const calTitle = document.getElementById('cal-title');
const calendarGrid = document.getElementById('calendar-grid');
const prevMonthBtn = document.getElementById('prev-month');
const nextMonthBtn = document.getElementById('next-month');
const todayBtn = document.getElementById('today-btn');
const themeSwitcher = document.getElementById('theme-switcher');

function loadTodos() {
  const s = localStorage.getItem(STORAGE_KEY);
  if (s) { try { todos = JSON.parse(s); } catch(e) { todos = []; } }
}

function saveTodos() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }
function saveCollapsed() { localStorage.setItem(COLLAPSED_KEY, JSON.stringify([...collapsedDates])); }

function loadTheme() {
  const t = localStorage.getItem(THEME_KEY);
  if (t) {
    document.body.dataset.theme = t;
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === t));
  }
}

function saveTheme(t) { localStorage.setItem(THEME_KEY, t); }

function addTodo(text, date) {
  todos.unshift({ id: generateId(), text: text.trim(), completed: false, createdAt: Date.now(), date: date });
  saveTodos();
  renderCalendar();
  render();renderQuickPhrases();
}

function toggleTodo(id) {
  const t = todos.find(x => x.id === id);
  if (t) {
    t.completed = !t.completed;
    t.completedAt = t.completed ? Date.now() : null;
    saveTodos();
    renderCalendar();
    render();renderQuickPhrases();
  }
}

function editTodo(id, text) {
  const t = todos.find(x => x.id === id);
  if (t && text.trim()) { t.text = text.trim(); saveTodos(); render();renderQuickPhrases(); }
}

function changeDate(id, currentDate) {
  const input = document.createElement('input');
  input.type = 'date';
  input.value = currentDate;
  input.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;padding:10px;border:1px solid var(--accent);border-radius:8px;background:var(--bg-card);color:var(--text-primary);';
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;';
  overlay.onclick = () => { document.body.removeChild(overlay); document.body.removeChild(input); };
  input.onchange = () => {
    if (input.value !== currentDate) {
      const t = todos.find(x => x.id === id);
      if (t) { t.date = input.value; saveTodos(); renderCalendar(); render();renderQuickPhrases(); }
    }
    document.body.removeChild(overlay);
    document.body.removeChild(input);
  };
  document.body.appendChild(overlay);
  document.body.appendChild(input);
  input.showPicker ? input.showPicker() : input.focus();
}

function deleteTodo(id) {
  todos = todos.filter(x => x.id !== id);
  saveTodos();
  renderCalendar();
  render();renderQuickPhrases();
}

function clearCompleted() {
  todos = todos.filter(x => !x.completed);
  saveTodos();
  renderCalendar();
  render();renderQuickPhrases();
}

function updateStats() {
  totalCount.textContent = todos.length;
  completedCount.textContent = todos.filter(x => x.completed).length;
  remainingCount.textContent = todos.length - todos.filter(x => x.completed).length;
}

function toggleCollapse(dateKey) {
  if (collapsedDates.has(dateKey)) collapsedDates.delete(dateKey);
  else collapsedDates.add(dateKey);
  saveCollapsed();
  const section = document.querySelector('.date-section[data-date="' + dateKey + '"]');
  if (section) section.classList.toggle('collapsed', collapsedDates.has(dateKey));
}

function getGroupedTodos() {
  let filtered = currentFilter === 'active' ? todos.filter(x => !x.completed) :
                 currentFilter === 'completed' ? todos.filter(x => x.completed) : todos;
  const today = formatDateKey(new Date());
  const yesterday = getYesterdayKey();
  const grouped = {};
  filtered.forEach(t => { if (!grouped[t.date]) grouped[t.date] = []; grouped[t.date].push({...t, isContinued: false}); });
  if (currentFilter !== 'completed') {
    const yesterdayUndone = todos.filter(x => x.date === yesterday && !x.completed && currentFilter === 'all');
    if (yesterdayUndone.length > 0) {
      if (!grouped[today]) grouped[today] = [];
      yesterdayUndone.forEach(x => grouped[today].push({...x, isContinued: true}));
    }
  }
  return grouped;
}

function startEdit(id, text) {
  const item = document.querySelector('.todo-item[data-id="' + id + '"]');
  const content = item.querySelector('.todo-content');
  const textEl = content.querySelector('.todo-text');
  textEl.style.display = 'none';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = text;
  input.style.cssText = 'width:100%;padding:6px 10px;border:1px solid var(--accent);border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg-primary);color:var(--text-primary);outline:none;';
  input.onblur = () => editTodo(id, input.value);

function render() {
  const grouped = getGroupedTodos();
  const today = formatDateKey(new Date());
  const dateKeys = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
  
  if (dateKeys.length === 0) {
    todoList.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><p>暂无任务</p></div>';
  } else {
    let html = '';
    dateKeys.forEach(dateKey => {
      const dayTodos = grouped[dateKey];
      const continued = dayTodos.filter(t => t.isContinued).length;
      const tag = getDateTag(dateKey);
      const subLabel = dateKey === today && continued > 0 ? ' <span style="color:#fb923c;font-size:10px">(含昨日未完成 ' + continued + ' 项)</span>' : '';
      const isPast = isPastDate(dateKey);
      const isCollapsed = collapsedDates.has(dateKey);
      const hint = isPast && isCollapsed ? '<span class="collapsed-hint">(' + dayTodos.length + ' 项)</span>' : '';
      
      html += '<div class="date-section' + (isCollapsed ? ' collapsed' : '') + '" data-date="' + dateKey + '">';
      html += '<div class="date-label" onclick="toggleCollapse(\'' + dateKey + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg>' + formatDisplayDate(dateKey) + ' ' + tag + ' <span class="count">(' + dayTodos.length + ')' + subLabel + hint + '</span><span class="chevron">▼</span></div>';
      html += '<div class="todo-list">' + dayTodos.map(t => {
        const cls = 'todo-item' + (t.completed ? ' completed' : '') + (t.isContinued ? ' continued' : '');
        let timeHtml = '<div class="todo-time"><span>创建 ' + formatTime(t.createdAt) + '</span>';
        if (t.completed && t.completedAt) timeHtml += '<span class="completed-time">完成 ' + formatFullTime(t.completedAt) + '</span>';
        timeHtml += '</div>';
        if (t.isContinued) timeHtml = '<div class="todo-time"><span class="todo-source">来自昨天</span></div>';
        return '<div class="' + cls + '" data-id="' + t.id + '"><div class="checkbox' + (t.completed ? ' checked' : '') + '" onclick="toggleTodo(\'' + t.id + '\')"></div><div class="todo-content"><div class="todo-date" onclick="changeDate(\'' + t.id + '\',\'' + t.date + '\')">' + formatDisplayDate(t.date) + '</div><div class="todo-text" ondblclick="startEdit(\'' + t.id + '\',\'' + escapeHtml(t.text).replace(/'/g, "\\'") + '\')">' + escapeHtml(t.text) + '</div>' + timeHtml + '</div><div class="todo-actions"><button class="btn-edit" onclick="startEdit(\'' + t.id + '\',\'' + escapeHtml(t.text).replace(/'/g, "\\'") + '\')" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="btn-delete" onclick="deleteTodo(\'' + t.id + '\')" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div></div>';
      }).join('') + '</div></div>';
    });
    todoList.innerHTML = html;
  }
  clearContainer.style.display = todos.some(t => t.completed) ? 'block' : 'none';
  updateStats();
}
