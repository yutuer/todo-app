<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f0f10;
      --bg-secondary: #18181b;
      --bg-card: #1c1c1f;
      --bg-hover: #27272a;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --border: #27272a;
      --accent: #8b5cf6;
      --accent-light: rgba(139, 92, 246, 0.15);
      --accent-hover: #a78bfa;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --danger: #f87171;
      --success: #4ade80;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --glow-1: rgba(139, 92, 246, 0.08);
      --glow-2: rgba(59, 130, 246, 0.06);
    }

    [data-theme="violet"] {
      --accent: #8b5cf6;
      --accent-light: rgba(139, 92, 246, 0.15);
      --accent-hover: #a78bfa;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --glow-1: rgba(139, 92, 246, 0.08);
      --glow-2: rgba(59, 130, 246, 0.06);
    }

    [data-theme="cyan"] {
      --accent: #06b6d4;
      --accent-light: rgba(6, 182, 212, 0.15);
      --accent-hover: #22d3ee;
      --accent-glow: rgba(6, 182, 212, 0.3);
      --glow-1: rgba(6, 182, 212, 0.08);
      --glow-2: rgba(16, 185, 129, 0.06);
    }

    [data-theme="coral"] {
      --accent: #f97316;
      --accent-light: rgba(249, 115, 22, 0.15);
      --accent-hover: #fb923c;
      --accent-glow: rgba(249, 115, 22, 0.3);
      --glow-1: rgba(249, 115, 22, 0.08);
      --glow-2: rgba(236, 72, 153, 0.06);
    }

    [data-theme="rose"] {
      --accent: #ec4899;
      --accent-light: rgba(236, 72, 153, 0.15);
      --accent-hover: #f472b6;
      --accent-glow: rgba(236, 72, 153, 0.3);
      --glow-1: rgba(236, 72, 153, 0.08);
      --glow-2: rgba(168, 85, 247, 0.06);
    }

    [data-theme="emerald"] {
      --accent: #10b981;
      --accent-light: rgba(16, 185, 129, 0.15);
      --accent-hover: #34d399;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --glow-1: rgba(16, 185, 129, 0.08);
      --glow-2: rgba(6, 182, 212, 0.06);
    }

    [data-theme="slate"] {
      --accent: #64748b;
      --accent-light: rgba(100, 116, 139, 0.15);
      --accent-hover: #94a3b8;
      --accent-glow: rgba(100, 116, 139, 0.3);
      --glow-1: rgba(100, 116, 139, 0.06);
      --glow-2: rgba(59, 130, 246, 0.05);
    }

    body {
      font-family: '"Inter"', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 24px;
      background-image: 
        radial-gradient(ellipse at 20% 0%, var(--glow-1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, var(--glow-2) 0%, transparent 50%);
      transition: background-image 0.3s;
    }

    .layout {
      display: flex;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .theme-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      padding: 10px;
      background: var(--bg-card);
      border-radius: 50px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid var(--border);
    }

    .theme-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .theme-dot:hover {
      transform: scale(1.15);
    }

    .theme-dot.active {
      border-color: var(--text-primary);
      transform: scale(1.1);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .theme-dot[data-theme="violet"] { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
    .theme-dot[data-theme="cyan"] { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .theme-dot[data-theme="coral"] { background: linear-gradient(135deg, #f97316, #ea580c); }
    .theme-dot[data-theme="rose"] { background: linear-gradient(135deg, #ec4899, #db2777); }
    .theme-dot[data-theme="emerald"] { background: linear-gradient(135deg, #10b981, #059669); }
    .theme-dot[data-theme="slate"] { background: linear-gradient(135deg, #64748b, #475569); }

    .calendar-card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: sticky;
      top: 24px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .cal-title {
      font-size: 13px;
      font-weight: 600;
    }

    .cal-nav {
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      color: var(--text-secondary);
    }

    .cal-nav:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 4px;
    }

    .calendar-weekdays span {
      font-size: 9px;
      color: var(--text-muted);
      padding: 3px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      color: var(--text-secondary);
    }

    .cal-day:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .cal-day.other-month {
      color: var(--text-muted);
      opacity: 0.35;
    }

    .cal-day.today {
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }

    .cal-day.selected {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: white;
      font-weight: 600;
    }

    .cal-day.has-todos::after {
      content: '';
      position: absolute;
      bottom: 3px;
      width: 3px;
      height: 3px;
      background: var(--accent);
      border-radius: 50%;
    }

    .cal-day.selected.has-todos::after {
      background: white;
    }

    .today-btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: var(--accent-light);
      border: 1px solid var(--accent-glow);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .today-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
      transition: color 0.3s, text-shadow 0.3s;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="date"] {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    input[type="date"]:focus {
      border-color: var(--accent);
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .btn-add {
      padding: 10px 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-add:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .filter-btn {
      padding: 7px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .date-section {
      margin-bottom: 14px;
    }

    .date-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 2px;
    }

    .date-label svg {
      width: 12px;
      height: 12px;
      color: var(--accent);
    }

    .date-label .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 500;
    }

    .date-label .tag.yesterday {
      background: rgba(251, 146, 60, 0.15);
      color: #fb923c;
    }

    .date-label .count {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .date-label .sub-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 4px;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .todo-item {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.25s ease;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }

    .todo-item:hover {
      border-color: var(--text-muted);
    }

    .todo-item.continued {
      border-left: 3px solid #fb923c;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .checkbox:hover {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .checkbox.checked {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .checkbox.checked::after {
      content: '';
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translateY(-1px);
    }

    .todo-content {
      flex: 1;
      min-width: 0;
    }

    .todo-text {
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .todo-item.completed .todo-text {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .todo-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .todo-source {
      font-size: 10px;
      color: #fb923c;
      margin-top: 2px;
    }

    .btn-delete {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      background: rgba(248, 113, 113, 0.1);
      color: var(--danger);
    }

    .btn-delete svg {
      width: 14px;
      height: 14px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 44px;
      height: 44px;
      margin-bottom: 12px;
      opacity: 0.4;
      color: var(--accent);
    }

    .empty-state p {
      font-size: 13px;
    }

    .clear-completed {
      margin-top: 16px;
      text-align: center;
    }

    .btn-clear {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-clear:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .calendar-card {
        position: static;
      }

      .input-row {
        flex-direction: column;
      }

      input[type="date"] {
        width: 100%;
      }

      .btn-add {
        width: 100%;
      }

      .theme-switcher {
        gap: 6px;
        padding: 8px;
      }

      .theme-dot {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="calendar-card">
        <div class="calendar-header">
          <button class="cal-nav" id="prev-month">&lt;</button>
          <span class="cal-title" id="cal-title"></span>
          <button class="cal-nav" id="next-month">&gt;</button>
        </div>
        <div class="calendar-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
        <button class="today-btn" id="today-btn">今天</button>
      </div>
    </aside>

    <main class="main">
      <header>
        <h1>待办事项</h1>
        <p class="subtitle">记录每天要完成的任务</p>
        <div class="theme-switcher" id="theme-switcher">
          <div class="theme-dot active" data-theme="violet" title="紫罗兰"></div>
          <div class="theme-dot" data-theme="cyan" title="青色"></div>
          <div class="theme-dot" data-theme="coral" title="珊瑚"></div>
          <div class="theme-dot" data-theme="rose" title="玫瑰"></div>
          <div class="theme-dot" data-theme="emerald" title="翡翠"></div>
          <div class="theme-dot" data-theme="slate" title="石墨"></div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="stat-value" id="total-count">0</div>
            <div class="stat-label">总计</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="completed-count">0</div>
            <div class="stat-label">已完成</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="remaining-count">0</div>
            <div class="stat-label">剩余</div>
          </div>
        </div>
      </header>

      <div class="input-card">
        <div class="input-row">
          <input type="date" id="todo-date">
          <input type="text" id="todo-input" placeholder="添加新任务..." maxlength="200" autocomplete="off">
          <button class="btn-add" id="add-btn">添加</button>
        </div>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="active">进行中</button>
        <button class="filter-btn" data-filter="completed">已完成</button>
      </div>

      <div class="todo-list" id="todo-list"></div>

      <div class="clear-completed" id="clear-container" style="display: none;">
        <button class="btn-clear" id="clear-btn">清除已完成</button>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'todos_v3';
    const THEME_KEY = 'todo_theme';
    let todos = [];
    let currentFilter = 'all';
    let currentMonth = new Date();
    let selectedDate = formatDateKey(new Date());

    const todoInput = document.getElementById('todo-input');
    const todoDate = document.getElementById('todo-date');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const clearBtn = document.getElementById('clear-btn');
    const clearContainer = document.getElementById('clear-container');
    const totalCount = document.getElementById('total-count');
    const completedCount = document.getElementById('completed-count');
    const remainingCount = document.getElementById('remaining-count');
    const calTitle = document.getElementById('cal-title');
    const calendarGrid = document.getElementById('calendar-grid');
    const prevMonthBtn = document.getElementById('prev-month');
    const nextMonthBtn = document.getElementById('next-month');
    const todayBtn = document.getElementById('today-btn');
    const themeSwitcher = document.getElementById('theme-switcher');

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function getYesterdayKey() {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      return formatDateKey(yesterday);
    }

    function formatDisplayDate(dateStr) {
      const date = new Date(dateStr);
      const today = new Date();
      const todayKey = formatDateKey(today);
      const yesterdayKey = getYesterdayKey();
      
      if (dateStr === todayKey) return '今天';
      if (dateStr === yesterdayKey) return '昨天';
      
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const weekday = weekdays[date.getDay()];
      return month + '月' + day + '日 ' + weekday;
    }

    function getDateTag(dateStr) {
      const todayKey = formatDateKey(new Date());
      const yesterdayKey = getYesterdayKey();
      
      if (dateStr === todayKey) return '<span class="tag">今天</span>';
      if (dateStr === yesterdayKey) return '<span class="tag yesterday">昨天</span>';
      return '';
    }

    function loadTodos() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          todos = JSON.parse(stored);
        } catch (e) {
          todos = [];
        }
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function loadTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved) {
        document.body.dataset.theme = saved;
        document.querySelectorAll('.theme-dot').forEach(dot => {
          dot.classList.toggle('active', dot.dataset.theme === saved);
        });
      }
    }

    function saveTheme(theme) {
      localStorage.setItem(THEME_KEY, theme);
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const hours = date.getHours().toString().padStart(2, '0');
      const minutes = date.getMinutes().toString().padStart(2, '0');
      return hours + ':' + minutes;
    }

    function addTodo(text, date) {
      const todo = {
        id: generateId(),
        text: text.trim(),
        completed: false,
        createdAt: Date.now(),
        date: date
      };
      todos.unshift(todo);
      saveTodos();
      renderCalendar();
      render();
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        saveTodos();
        renderCalendar();
        render();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      saveTodos();
      renderCalendar();
      render();
    }

    function clearCompleted() {
      todos = todos.filter(t => !t.completed);
      saveTodos();
      renderCalendar();
      render();
    }

    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const remaining = total - completed;
      
      totalCount.textContent = total;
      completedCount.textContent = completed;
      remainingCount.textContent = remaining;
    }

    function getFilteredAndGroupedTodos() {
      let filtered = todos;
      
      if (currentFilter === 'active') {
        filtered = filtered.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        filtered = filtered.filter(t => t.completed);
      }
      
      const todayKey = formatDateKey(new Date());
      const yesterdayKey = getYesterdayKey();
      const grouped = {};
      
      // 正常分组
      filtered.forEach(t => {
        if (!grouped[t.date]) grouped[t.date] = [];
        grouped[t.date].push({...t, isContinued: false});
      });
      
      // 如果有昨天未完成的任务，且不在"已完成"筛选下
      if (currentFilter !== 'completed') {
        const yesterdayUndone = todos.filter(t => 
          t.date === yesterdayKey && 
          !t.completed && 
          currentFilter === 'all'
        );
        
        if (yesterdayUndone.length > 0) {
          // 将昨天未完成的任务添加到今天分组
          if (!grouped[todayKey]) grouped[todayKey] = [];
          yesterdayUndone.forEach(t => {
            grouped[todayKey].push({...t, isContinued: true});
          });
        }
      }
      
      return grouped;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      
      calTitle.textContent = year + '年 ' + (month + 1) + '月';
      
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startDow = firstDay.getDay();
      const daysInMonth = lastDay.getDate();
      
      const today = new Date();
      const todayKey = formatDateKey(today);
      
      let html = '';
      
      const prevMonth = new Date(year, month, 0);
      const prevDays = prevMonth.getDate();
      for (let i = startDow - 1; i >= 0; i--) {
        const d = prevDays - i;
        html += '<div class="cal-day other-month">' + d + '</div>';
      }
      
      for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = formatDateKey(new Date(year, month, d));
        const isToday = dateKey === todayKey;
        const isSelected = dateKey === selectedDate;
        const hasTodos = todos.some(t => t.date === dateKey);
        
        let classes = 'cal-day';
        if (isToday) classes += ' today';
        if (isSelected) classes += ' selected';
        if (hasTodos) classes += ' has-todos';
        
        html += '<div class="' + classes + '" data-date="' + dateKey + '">' + d + '</div>';
      }
      
      const totalCells = startDow + daysInMonth;
      const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let d = 1; d <= remaining; d++) {
        html += '<div class="cal-day other-month">' + d + '</div>';
      }
      
      calendarGrid.innerHTML = html;
      
      calendarGrid.querySelectorAll('.cal-day:not(.other-month)').forEach(el => {
        el.addEventListener('click', () => {
          selectedDate = el.dataset.date;
          todoDate.value = selectedDate;
          renderCalendar();
          render();
        });
      });
    }

    function render() {
      const grouped = getFilteredAndGroupedTodos();
      const dateKeys = Object.keys(grouped).sort().reverse();
      const todayKey = formatDateKey(new Date());
      const yesterdayKey = getYesterdayKey();
      
      if (dateKeys.length === 0) {
        todoList.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg><p>' + (currentFilter === 'all' ? '暂无任务，添加一个吧' : currentFilter === 'active' ? '没有进行中的任务' : '暂无已完成的任务') + '</p></div>';
      } else {
        let html = '';
        dateKeys.forEach(dateKey => {
          const dayTodos = grouped[dateKey];
          const continuedCount = dayTodos.filter(t => t.isContinued).length;
          const tag = getDateTag(dateKey);
          
          let subLabel = '';
          if (dateKey === todayKey && continuedCount > 0) {
            subLabel = '<span class="sub-label">(含昨日未完成 ' + continuedCount + ' 项)</span>';
          }
          
          html += '<div class="date-section"><div class="date-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' + formatDisplayDate(dateKey) + ' ' + tag + ' <span class="count">(' + dayTodos.length + ')' + subLabel + '</span></div>';
          html += '<div class="todo-list">' + dayTodos.map(todo => {
            const isContinued = todo.isContinued;
            const itemClass = 'todo-item' + (todo.completed ? ' completed' : '') + (isContinued ? ' continued' : '');
            const timeHtml = isContinued ? '<div class="todo-time">' + formatTime(todo.createdAt) + '</div><div class="todo-source">来自昨天</div>' : '<div class="todo-time">' + formatTime(todo.createdAt) + '</div>';
            return '<div class="' + itemClass + '" data-id="' + todo.id + '"><div class="checkbox ' + (todo.completed ? 'checked' : '') + '" onclick="toggleTodo(\'' + todo.id + '\')"></div><div class="todo-content"><div class="todo-text">' + escapeHtml(todo.text) + '</div>' + timeHtml + '</div><button class="btn-delete" onclick="deleteTodo(\'' + todo.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div>';
          }).join('') + '</div></div>';
        });
        todoList.innerHTML = html;
      }

      const hasCompleted = todos.some(t => t.completed);
      clearContainer.style.display = hasCompleted ? 'block' : 'none';
      
      updateStats();
    }

    addBtn.addEventListener('click', () => {
      const text = todoInput.value.trim();
      const date = todoDate.value || formatDateKey(new Date());
      if (text) {
        addTodo(text, date);
        todoInput.value = '';
        todoInput.focus();
      }
    });

    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const text = todoInput.value.trim();
        const date = todoDate.value || formatDateKey(new Date());
        if (text) {
          addTodo(text, date);
          todoInput.value = '';
        }
      }
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    clearBtn.addEventListener('click', clearCompleted);

    prevMonthBtn.addEventListener('click', () => {
      currentMonth.setMonth(currentMonth.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentMonth.setMonth(currentMonth.getMonth() + 1);
      renderCalendar();
    });

    todayBtn.addEventListener('click', () => {
      selectedDate = formatDateKey(new Date());
      currentMonth = new Date();
      todoDate.value = selectedDate;
      renderCalendar();
      render();
    });

    themeSwitcher.addEventListener('click', (e) => {
      const dot = e.target.closest('.theme-dot');
      if (dot) {
        document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        const theme = dot.dataset.theme;
        document.body.dataset.theme = theme;
        saveTheme(theme);
      }
    });

    todoDate.value = selectedDate;
    loadTodos();
    loadTheme();
    renderCalendar();
    render();
  </script>
</body>
</html>
