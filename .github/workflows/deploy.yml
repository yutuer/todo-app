name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stamp build info
        run: |
          STAMP="${GITHUB_SHA:0:7} - $(date -u '+%m-%d %H:%M') UTC"
          sed -i "s|id=\"build-stamp\">dev<|id=\"build-stamp\">${STAMP}<|" index.html
          echo "build stamp -> ${STAMP}"
          # 注入失败必须让 CI 失败：校验"实际戳 == 期望戳"，而非"dev 是否还在"。
          # 后者会在锚点被改名时误判为通过（sed 注到新名字，旧串自然找不到）。
          if ! grep -qF "id=\"build-stamp\">${STAMP}<" index.html; then
            echo "::error::构建戳注入失败，index.html 中的锚点可能已变更"
            exit 1
          fi
          grep -o 'id="build-stamp">[^<]*' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
